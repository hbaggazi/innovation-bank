<script>/* محلّل ملف Word والتحقق داخل المتصفح — مضمّن */
/* ══════════════════════════════════════════════════════════════════════
   المسار اليدوي: قراءة ملف بنك Word داخل المتصفح والتحقق منه — محليًا وبلا إنترنت.

   يعكس هذا الملف منطق أدوات بايثون نفسه (tools/extract_bank.py و tools/validate_bank.py):
   المخطط واحد، وقواعد التحقق واحدة. المسار اليدوي بديل احتياطي لا بنك ثانٍ مستقل.

   قيود ثابتة:
     • لا يقرأ إلا الملف الذي يختاره المستخدم صراحةً عبر نافذة اختيار الملفات.
     • لا يتصفّح المجلدات، ولا يمسح الجهاز، ولا يرفع الملف إلى أي جهة.
     • لا يعدّل ملف Word، ولا يخترع حقلًا غير موجود.
     • لا يتصل بالإنترنت إطلاقًا؛ مكتبة فك الضغط محمّلة محليًا من ./assets/vendor/.
   ══════════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  var R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  var CARD_RE = /^([A-Z]{3})-(\d{2})\b/;
  var CARD_FULL_RE = /^[A-Z]{3}-\d{2}$/;
  var RAD_RE = /^RAD-\d+/i;
  var RAD_FULL_RE = /^RAD-\d+$/i;
  var SRC_RE = /^\[([ء-ي]{1,3}\d{1,3})\]\s*([\s\S]*)$/;
  var CODE_IN_TEXT = /\b[A-Z]{3}-\d{2}\b/g;
  var URL_RE = /^https?:\/\/\S+$/;
  var SECTOR_HDR = /بطاقات\s+موثقة/;
  var CODE_LINE = /الرمز\s+([A-Z]{3})/;

  var COMPETITION_SECTION_TITLES = ['مسابقات وفعاليات ابتكارية ذات صلة'];
  var SECTION_BREAKERS = ['خريطة البنك', 'الفهارس التقاطعية', 'سجل المصادر', 'رادار التحديات',
                          'نافذة الفرص', 'قواعد التوثيق', 'عن البنك'];
  var COMP_COLS = {
    name: ['المسابقة / الفعالية', 'المسابقة/الفعالية', 'المسابقة', 'الفعالية', 'المرشح',
           'الاسم', 'اسم المسابقة', 'المسابقة أو الفعالية'],
    organizer: ['الجهة المنظمة', 'الجهة', 'المنظّم', 'المنظم'],
    field: ['المجالات المثبتة من المصدر', 'المجالات', 'المجال/القطاع', 'المجال أو القطاع', 'المجال'],
    verification_status: ['حالة التوثيق', 'الحالة التوثيقية', 'حالة التحقق', 'الحالة', 'التوثيق'],
    official_source_url: ['المصدر الرسمي', 'الرابط الرسمي', 'المصدر'],
    related_card_codes: ['بطاقات موثقة ذات صلة', 'بطاقات ذات صلة', 'البطاقات المرتبطة'],
    notes: ['سبب بقائه قيد التحقق', 'ملاحظات', 'ملاحظة'],
    verification_requirement: ['المطلوب للتحقق'],
    update_status: ['حالة التحديث', 'التحديث']
  };
  /* مفاتيح المجالات كما ترد في المصدر — لا قائمة مجالات ثابتة ولا اشتقاق من الأوصاف */
  var DOMAIN_KEYS = ['المجالات العامة', 'المجالات المثبتة من المصدر', 'المجالات', 'المجال'];
  /* مفاتيح الملف الوصفي للمسابقة (جدول مفتاح/قيمة) */
  var COMP_PROFILE_KEYS = {
    organizer: ['الجهة المنظمة', 'الجهة'],
    verification_status: ['حالة التوثيق', 'الحالة'],
    source: ['المصدر الرسمي في سجل البنك', 'المصدر الرسمي', 'المصدر'],
    related_card_codes: ['بطاقات موثقة ذات صلة', 'بطاقات ذات صلة'],
    notes: ['ملاحظات', 'ملاحظة'],
    update_status: ['حالة التحديث']
  };


  function norm(s) { return (s || '').replace(/[ \t ]+/g, ' ').trim(); }

  function splitDomains(t) {
    /* تقسيم نص المجالات كما ورد على الفواصل العربية (، و ؛) فقط؛ بلا إضافة ولا إعادة تصنيف */
    if (!t) return [];
    var out = [];
    t.split(/[،؛]/).forEach(function (x) {
      x = norm(x).replace(/^[.\s]+|[.\s]+$/g, '');
      if (x && out.indexOf(x) < 0) out.push(x);
    });
    return out;
  }

  function addSource(data, m, links) {
    var code = m[1];
    for (var i = 0; i < data.sources.length; i++) { if (data.sources[i].code === code) return; }
    var name = m[2].replace(/\nفتح المصدر الرسمي/g, '').replace(/فتح المصدر الرسمي/g, '');
    name = norm(name.replace(/\//g, ' / ')).replace(/^[\s/]+|[\s/]+$/g, '');
    data.sources.push({ code: code, name: name, url: (links && links[0]) || null });
  }
  function codesIn(t) {
    if (!t || t.trim() === '—' || t.trim() === '-' || !t.trim()) return [];
    return t.match(CODE_IN_TEXT) || [];
  }

  /* ── ١) فك ضغط ملف docx وقراءة أجزائه ── */
  function readDocx(uint8) {
    if (!global.fflate || typeof global.fflate.unzipSync !== 'function') {
      throw new Error('مكتبة قراءة ملفات Word غير محمّلة. تأكّد من وجود مجلد assets داخل مجلد البنك.');
    }
    var files;
    try { files = global.fflate.unzipSync(uint8); }
    catch (e) { throw new Error('تعذّر فتح الملف. تأكّد أنه ملف Word بصيغة ‎.docx‎ وغير تالف.'); }
    if (!files['word/document.xml']) {
      throw new Error('الملف المختار ليس مستند Word صالحًا (لا يحتوي على word/document.xml).');
    }
    var dec = new TextDecoder('utf-8');
    var parser = new DOMParser();

    var rels = {};
    if (files['word/_rels/document.xml.rels']) {
      var rx = parser.parseFromString(dec.decode(files['word/_rels/document.xml.rels']), 'application/xml');
      var rl = rx.getElementsByTagName('Relationship');
      for (var i = 0; i < rl.length; i++) {
        var t = rl[i].getAttribute('Target') || '';
        if (rl[i].getAttribute('TargetMode') === 'External' || t.indexOf('http') === 0) {
          rels[rl[i].getAttribute('Id')] = t;
        }
      }
    }

    var doc = parser.parseFromString(dec.decode(files['word/document.xml']), 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) {
      throw new Error('تعذّر تحليل محتوى المستند.');
    }
    var body = doc.getElementsByTagNameNS(W, 'body')[0];
    if (!body) throw new Error('المستند لا يحتوي على متن قابل للقراءة.');

    function paraText(p) {
      var out = [], walk = p.getElementsByTagName('*');
      for (var i = 0; i < walk.length; i++) {
        var ln = walk[i].localName;
        if (ln === 't') out.push(walk[i].textContent || '');
        else if (ln === 'br' || ln === 'cr') out.push('\n');
        else if (ln === 'tab') out.push(' ');
      }
      return out.join('');
    }
    function paraLinks(p) {
      var out = [], hs = p.getElementsByTagNameNS(W, 'hyperlink');
      for (var i = 0; i < hs.length; i++) {
        var id = hs[i].getAttributeNS(R, 'id');
        if (id && rels[id]) out.push(rels[id]);
      }
      return out;
    }
    function cellOf(tc) {
      var texts = [], links = [], kids = tc.childNodes;
      for (var i = 0; i < kids.length; i++) {
        if (kids[i].nodeType === 1 && kids[i].localName === 'p') {
          texts.push(paraText(kids[i]));
          links = links.concat(paraLinks(kids[i]));
        }
      }
      return { text: texts.join('\n').trim(), links: links };
    }

    var blocks = [], kids = body.childNodes;
    for (var k = 0; k < kids.length; k++) {
      var n = kids[k];
      if (n.nodeType !== 1) continue;
      if (n.localName === 'p') {
        var txt = paraText(n).trim(), lk = paraLinks(n);
        if (txt || lk.length) blocks.push({ kind: 'p', text: txt, links: lk });
      } else if (n.localName === 'tbl') {
        var rows = [], trs = n.childNodes;
        for (var r = 0; r < trs.length; r++) {
          if (trs[r].nodeType !== 1 || trs[r].localName !== 'tr') continue;
          var tcs = trs[r].childNodes, cells = [], seen = {};
          for (var c = 0; c < tcs.length; c++) {
            if (tcs[c].nodeType !== 1 || tcs[c].localName !== 'tc') continue;
            var cl = cellOf(tcs[c]);
            if (cl.text && seen[cl.text]) continue;   /* إزالة تكرار الخلايا المدموجة */
            if (cl.text) seen[cl.text] = 1;
            cells.push(cl);
          }
          rows.push(cells);
        }
        blocks.push({ kind: 'table', rows: rows });
      }
    }
    return blocks;
  }

  /* ── ٢) تحويل الكتل إلى بيانات مهيكلة (المنطق نفسه المستخدم في بايثون) ── */
  function parseCard(cellText) {
    var lines = cellText.split('\n').map(norm).filter(Boolean);
    if (!lines.length) return null;
    var m = CARD_RE.exec(lines[0]);
    if (!m) return null;
    var code = lines[0].split(/\s+/)[0].trim();
    var card = {
      code: code, sector_code: m[1], title: lines[0].slice(code.length).trim(),
      sector: null, sector_label: null, documentation_type: null, scope: null,
      description: null, reference_year: null, tags: [], source_codes: [], documentation_text: null
    };
    for (var i = 1; i < lines.length; i++) {
      var ln = lines[i];
      if ((ln.indexOf('القطاع:') >= 0 || ln.indexOf('التصنيف:') >= 0) && ln.indexOf('|') >= 0) {
        ln.split('|').map(function (x) { return x.trim(); }).forEach(function (part) {
          if (part.indexOf('القطاع:') === 0 || part.indexOf('التصنيف:') === 0) {
            card.sector_label = part.split(':')[0].trim();
            card.sector = part.slice(part.indexOf(':') + 1).trim();
          } else if (part.indexOf('النطاق:') === 0) {
            card.scope = part.slice(part.indexOf(':') + 1).trim();
          } else if (part) {
            card.documentation_type = part;
          }
        });
      } else if (ln.indexOf('وصف المشكلة:') === 0) {
        card.description = ln.slice(ln.indexOf(':') + 1).trim();
      } else if (ln.indexOf('التوثيق:') === 0) {
        card.documentation_text = ln;
        ln.split('|').map(function (x) { return x.trim(); }).forEach(function (part) {
          if (part.indexOf('التوثيق:') === 0) {
            var body = part.slice(part.indexOf(':') + 1).trim();
            var mm = body.match(/\[([^\]]+)\]/g) || [];
            card.source_codes = mm.map(function (x) { return x.slice(1, -1); });
          } else if (part.indexOf('سنة المرجع') === 0) {
            card.reference_year = part.slice(part.indexOf(':') + 1).trim();
          } else if (part.indexOf('الوسوم') === 0) {
            card.tags = part.slice(part.indexOf(':') + 1).split('،')
              .map(function (t) { return t.trim(); }).filter(Boolean);
          }
        });
      }
    }
    return card;
  }

  function extract(blocks) {
    var data = {
      about: {}, documentation_rules: [], documentation_tags: [], sectors: [], axis: null,
      cards: [], sources: [], radar: { intro: null, note: null, summary: [], items: [] },
      opportunities: [], opportunities_note: null, competitions: [], competitions_present: false,
      competitions_notes: [], competitions_update_rule: null,
      cross_index: [], vision_policy: [], extraction_notes: []
    };
    var radarGroup = null, inRadar = false, compOpen = false, compGroup = null, compName = null,
        lastPara = '', paras = [];

    function cellsText(row) {
      return row.map(function (c) { return norm(c.text.replace(/\n/g, ' | ')); });
    }

    blocks.forEach(function (b) {
      if (b.kind === 'p') {
        var t = norm(b.text);
        paras.push(t); lastPara = t;
        if (t.indexOf('رادار التحديات') >= 0) inRadar = true;
        var isSectionTitle = false;
        COMPETITION_SECTION_TITLES.forEach(function (x) {
          if (t.indexOf(x) >= 0) { compOpen = true; data.competitions_present = true; compGroup = null; isSectionTitle = true; }
        });
        if (!isSectionTitle && compOpen) {
          if (SECTION_BREAKERS.some(function (x) { return t.indexOf(x) === 0 || t.slice(0, 30).indexOf(x) >= 0; })) {
            compOpen = false;                        /* بدأ قسم آخر: يُغلق نطاق الطبقة */
          } else if (t.indexOf('أولًا') === 0 || t.indexOf('ثانيًا') === 0 || t.indexOf('ثالثًا') === 0) {
            compGroup = t;
          } else if (t.indexOf('قاعدة التحديث') === 0) {
            data.competitions_update_rule = t;
          } else if (t.length > 90 || t.indexOf('تحديث ') === 0 || t.indexOf('طبقة مرجعية') >= 0) {
            data.competitions_notes.push(t);
          } else {
            compName = t;                       /* عنوان ملف مسابقة */
          }
        }
        if (t.indexOf('•') === 0) {
          b.text.split('\n').forEach(function (x) {
            var v = norm(x);
            if (v.indexOf('•') === 0) data.documentation_rules.push(v.replace(/^•\s*/, '').trim());
          });
        }
        return;
      }
      var rows = b.rows;
      if (!rows || !rows.length) return;
      var hdr = cellsText(rows[0]), hj = hdr.join(' ~ ');

      if (rows.length === 1 && hdr.length <= 2 && hj.indexOf('الغرض') >= 0) {
        var raw = rows[0][rows[0].length - 1].text.trim();
        data.about.purpose = raw.indexOf('الغرض') === 0 ? norm(raw.slice(raw.indexOf('\n') + 1)) : norm(raw);
        return;
      }
      if (rows.length === 1 && hj.indexOf('يُقدَّم المصدر الرسمي') >= 0) {
        data.about.source_precedence = rows[0][0].text.trim(); return;
      }
      if (hdr[0] === 'الوسم' && hdr[1] === 'التعريف') {
        rows.slice(1).forEach(function (r) {
          var c = cellsText(r);
          if (c.length >= 2 && c[0]) data.documentation_tags.push({ tag: c[0], definition: c[1] });
        });
        return;
      }
      if (hdr[0] === 'القطاع' && hdr[1] === 'رمز البطاقات' && hdr[2] === 'عدد البطاقات') {
        rows.slice(1).forEach(function (r) {
          var c = cellsText(r);
          if (c.length >= 3 && c[0]) {
            var d = (c[2] || '').replace(/\D/g, '');
            data.sectors.push({ name: c[0], code: (c[1] || '').trim(), declared_card_count: d ? parseInt(d, 10) : null });
          }
        });
        return;
      }
      if (hdr[0] === 'الفرصة' && hj.indexOf('الحالة عند الإصدار') >= 0) {
        rows.slice(1).forEach(function (r) {
          var c = cellsText(r);
          if (c.length >= 4 && c[0]) {
            var mm = (c[3] || '').match(/\[([^\]]+)\]/g) || [];
            data.opportunities.push({
              name: c[0], topic: c[1], status_at_release: c[2],
              source_codes: mm.map(function (x) { return x.slice(1, -1); })
            });
          }
        });
        data.opportunities_note = lastPara || null;
        return;
      }
      if (hdr[0] === 'البند' && hdr[1] === 'العدد') {
        rows.slice(1).forEach(function (r) {
          var c = cellsText(r);
          if (c.length >= 2 && c[0]) data.radar.summary.push({ item: c[0], count: c[1] });
        });
        return;
      }
      if (hdr[0] === 'التقاطع') {
        var mode = 'cross';
        rows.slice(1).forEach(function (r) {
          var c = cellsText(r);
          if (c.length < 2 || !c[0]) return;
          if (c[0].indexOf('صلة رؤية السعودية') === 0) { mode = 'vision'; return; }
          if (mode === 'cross' && c[0].indexOf('×') >= 0) {
            data.cross_index.push({ intersection: c[0], related_cards_raw: c[1], related_card_codes: codesIn(c[1]) });
          } else if (mode === 'vision') {
            if (SECTOR_HDR.test(c[1]) && CODE_LINE.test(c[1])) { mode = 'body'; return; }
            data.vision_policy.push({ key: c[0], rule: c[1] });
          }
        });
      }
      /* نمط الملف الوصفي (إصدارات الملفات الوصفية): جدول عمودين أول مفتاح فيه من مفاتيح الملف */
      if (compOpen && rows.length >= 2 && rows[0].length === 2 &&
          Object.keys(COMP_PROFILE_KEYS).some(function (f) {
            return COMP_PROFILE_KEYS[f].some(function (k) { return hdr[0] === k || hdr[0].indexOf(k) === 0; });
          })) {
        var pit = { name: compName, group: compGroup, profile: [], domains: [],
                    organizer: null, field: null, verification_status: null,
                    official_source_url: null, official_source_label: null,
                    related_card_codes: [], notes: null, verification_requirement: null,
                    update_status: null, source_codes: [] };
        rows.forEach(function (r) {
          var c = cellsText(r);
          if (c.length < 2 || !c[0]) return;
          var key = c[0], val = c[1];
          var ms = SRC_RE.exec(key);
          if (ms && !val) { addSource(data, ms, r[0].links); return; }  /* سطر سجل مصادر داخل الجدول */
          var mapped = null;
          Object.keys(COMP_PROFILE_KEYS).forEach(function (f) {
            if (mapped) return;
            if (COMP_PROFILE_KEYS[f].some(function (k) { return key === k || key.indexOf(k) === 0; })) mapped = f;
          });
          if (mapped === 'organizer') pit.organizer = val;
          else if (mapped === 'verification_status') pit.verification_status = val;
          else if (mapped === 'source') {
            var mm = val.match(/\[([^\]]+)\]/g) || [];
            pit.source_codes = mm.map(function (x) { return x.slice(1, -1); });
            var lks = [];
            r.forEach(function (cell) { lks = lks.concat(cell.links || []); });
            pit.official_source_url = lks.length ? lks[0] : null;
            var lbl = norm(val.replace(/فتح المصدر الرسمي/g, ''));
            pit.official_source_label = lbl || null;
          } else if (mapped === 'related_card_codes') pit.related_card_codes = codesIn(val);
          else if (mapped === 'notes') pit.notes = val;
          else if (mapped === 'update_status') pit.update_status = val;
          else if (DOMAIN_KEYS.some(function (k) { return key === k || key.indexOf(k) === 0; })) {
            pit.field = val;                       /* النص كما ورد */
            pit.domains = splitDomains(val);       /* وسوم مشتقة من النص نفسه */
            pit.profile.push({ label: key, value: val });
          } else pit.profile.push({ label: key, value: val });
        });
        if (pit.name) data.competitions.push(pit);
        return;
      }

      if (compOpen) {
        var isComp = hdr.some(function (h) {
          return COMP_COLS.name.some(function (n) { return h.trim() === n || h.indexOf(n) >= 0; });
        });
        if (isComp) {
          /* مطابقة على مرحلتين: تطابق تام ثم جزئي، تفاديًا لالتقاط اسم عمود داخل عنوان عمود آخر */
          var colmap = {}, taken = {};
          [true, false].forEach(function (exact) {
            hdr.forEach(function (h, idx) {
              if (taken[idx]) return;
              var fields = Object.keys(COMP_COLS);
              for (var fi = 0; fi < fields.length; fi++) {
                var field = fields[fi];
                if (colmap[field] !== undefined) continue;
                var hit = exact ? (COMP_COLS[field].indexOf(h.trim()) >= 0)
                                : COMP_COLS[field].some(function (n) { return h.indexOf(n) >= 0; });
                if (hit) { colmap[field] = idx; taken[idx] = 1; break; }
              }
            });
          });
          rows.slice(1).forEach(function (r) {
            var c = cellsText(r);
            if (!c.some(Boolean)) return;
            var item = {};
            Object.keys(colmap).forEach(function (field) {
              var idx = colmap[field];
              if (idx >= c.length) return;
              var val = (c[idx] || '').trim();
              if (field === 'related_card_codes') item[field] = codesIn(val);
              else if (field === 'official_source_url') {
                var lks = r[idx] ? r[idx].links : [];
                item[field] = lks && lks.length ? lks[0] : (val.indexOf('http') === 0 ? val : null);
                if (val && val.indexOf('http') !== 0) item.official_source_label = val;
                var mmc = val.match(/\[([^\]]+)\]/g) || [];
                item.source_codes = mmc.map(function (x) { return x.slice(1, -1); });
              } else item[field] = val || null;
            });
            Object.keys(COMP_COLS).forEach(function (f) {
              if (item[f] === undefined) item[f] = (f === 'related_card_codes') ? [] : null;
            });
            if (item.source_codes === undefined) item.source_codes = [];
            if (item.verification_requirement === undefined) item.verification_requirement = null;
            item.domains = splitDomains(item.field);
            item.group = compGroup;
            if (item.official_source_label === 'فتح المصدر الرسمي' || item.official_source_label === 'المصدر الرسمي')
              item.official_source_label = null;
            data.competitions.push(item);
          });
          return;
        }
      }

      /* الجداول الطويلة: رؤوس القطاعات + البطاقات + الرادار + سجل المصادر */
      rows.forEach(function (r) {
        if (!r.length) return;
        var texts = r.map(function (c) { return c.text.trim(); });
        var first = texts[0];
        if (!first && texts.length === 1) return;

        if (RAD_RE.test(first) && texts.length >= 6) {
          var c = cellsText(r);
          data.radar.items.push({
            code: c[0], title: c[1], group: radarGroup, coverage_status: c[2],
            related_verified_cards: codesIn(c[3]), related_verified_cards_raw: c[3],
            source_grade: c[4], reason: c[5]
          });
          return;
        }
        if (inRadar && texts.length === 1 && first && !RAD_RE.test(first) && first.length < 60 && first.indexOf('[') < 0) {
          radarGroup = norm(first); return;
        }
        var sm = SRC_RE.exec(first);
        if (sm && (texts.length === 1 || !texts.slice(1).some(Boolean))) {
          addSource(data, sm, r[0].links);
          return;
        }
        if (texts.length >= 2 && SECTOR_HDR.test(texts[1]) && CODE_LINE.test(texts[1])) {
          var cm = CODE_LINE.exec(texts[1]);
          var cnt = /(\d+)\s*بطاقات/.exec(texts[1]);
          var entry = {
            name: norm(texts[0]), code: cm[1],
            declared_card_count: cnt ? parseInt(cnt[1], 10) : null,
            is_axis: texts[1].indexOf('محور وطني عابر للقطاعات') >= 0
          };
          if (entry.is_axis) data.axis = entry;
          return;
        }
        if (CARD_RE.test(first)) {
          var card = parseCard(r[0].text);
          if (card) data.cards.push(card);
        }
      });
    });

    paras.forEach(function (t) {
      if (t.indexOf('يضم هذا القسم') === 0) data.radar.intro = t;
      if (t.indexOf('ملاحظة منهجية') === 0) data.radar.note = t;
      if (t.indexOf('مرجع رؤية السعودية 2030') === 0) data.about.vision_reference_rule = t;
      if (t.indexOf('بنك التحديات والابتكار الطلابي') === 0) data.radar.discovery_source = t;
    });

    if (!data.competitions_present) {
      data.extraction_notes.push('لا يتضمّن هذا الإصدار قسمًا باسم «مسابقات وفعاليات ابتكارية ذات صلة»؛ ' +
        'أُبقيت طبقة المسابقات فارغة ولم يُنشأ لها أي محتوى.');
    }
    return data;
  }

  /* ── ٣) التحقق: القواعد نفسها المطبّقة في tools/validate_bank.py ── */
  function validate(data) {
    var errors = [], warnings = [];
    var E = function (m) { errors.push(m); }, Wn = function (m) { warnings.push(m); };
    var cards = data.cards || [], sources = data.sources || [], sectors = data.sectors || [];
    var axis = data.axis, radar = data.radar || {}, items = radar.items || [], comps = data.competitions || [];
    var codes = cards.map(function (c) { return c.code; });
    var count = function (arr) { var m = {}; arr.forEach(function (x) { m[x] = (m[x] || 0) + 1; }); return m; };

    if (!cards.length) E('لم تُستخرج أي بطاقة من الملف المختار.');
    if (!sources.length) E('لم يُستخرج أي مصدر من سجل المصادر.');
    if (!sectors.length) E('لم تُستخرج خريطة القطاعات.');

    var cc = count(codes);
    Object.keys(cc).forEach(function (k) { if (cc[k] > 1) E('رمز بطاقة مكرّر: ' + k + ' (تكرّر ' + cc[k] + ' مرات).'); });
    codes.forEach(function (k) { if (k && !CARD_FULL_RE.test(k)) E('رمز بطاقة بصيغة غير متوقعة: ' + k); });

    var REQ = [['title', 'العنوان'], ['sector', 'القطاع'], ['documentation_type', 'نوع التوثيق'],
               ['scope', 'النطاق'], ['description', 'وصف المشكلة'], ['reference_year', 'سنة المرجع']];
    cards.forEach(function (c) {
      REQ.forEach(function (f) { if (!c[f[0]]) E('البطاقة ' + (c.code || '؟') + ': الحقل «' + f[1] + '» غير مستخرج.'); });
      if (!c.source_codes || !c.source_codes.length) E('البطاقة ' + (c.code || '؟') + ': لا يوجد مرجع مصدر في سطر التوثيق.');
    });

    var known = {};
    sectors.forEach(function (s) { if (s.code) known[s.code] = 1; });
    if (axis && axis.code) known[axis.code] = 1;
    cards.forEach(function (c) {
      if (c.sector_code && !known[c.sector_code]) E('البطاقة ' + c.code + ' تنتمي إلى رمز قطاع غير معروف: ' + c.sector_code);
    });

    var srcSet = {};
    sources.forEach(function (s) { if (s.code) srcSet[s.code] = 1; });
    var sc = count(sources.map(function (s) { return s.code; }));
    Object.keys(sc).forEach(function (k) { if (sc[k] > 1) E('رمز مصدر مكرّر في السجل: ' + k); });
    cards.forEach(function (c) {
      (c.source_codes || []).forEach(function (x) {
        if (!srcSet[x]) E('البطاقة ' + c.code + ' تشير إلى مصدر غير موجود في سجل المصادر: [' + x + ']');
      });
    });
    var used = {};
    cards.forEach(function (c) { (c.source_codes || []).forEach(function (x) { used[x] = 1; }); });
    (data.opportunities || []).forEach(function (o) { (o.source_codes || []).forEach(function (x) { used[x] = 1; }); });
    comps.forEach(function (cm) { (cm.source_codes || []).forEach(function (x) { used[x] = 1; }); });
    var unused = Object.keys(srcSet).filter(function (k) { return !used[k]; }).sort();
    if (unused.length) Wn('مصادر مسجّلة لا تستند إليها أي بطاقة أو فرصة (' + unused.length + '): ' + unused.join('، '));

    sources.forEach(function (s) {
      if (!s.url) E('المصدر [' + s.code + '] بلا رابط رسمي.');
      else if (!URL_RE.test(s.url)) E('المصدر [' + s.code + '] يحمل رابطًا غير سليم الصيغة: ' + s.url);
    });

    var rc = count(items.map(function (r) { return r.code; }));
    Object.keys(rc).forEach(function (k) { if (rc[k] > 1) E('رمز رادار مكرّر: ' + k + ' (تكرّر ' + rc[k] + ' مرات).'); });
    items.forEach(function (r) {
      if (r.code && !RAD_FULL_RE.test(r.code)) E('رمز رادار بصيغة غير متوقعة: ' + r.code);
      if (!r.coverage_status) E('بند الرادار ' + (r.code || '؟') + ' بلا حالة تغطية.');
      if (!r.group) Wn('بند الرادار ' + (r.code || '؟') + ' بلا مجموعة موضوعية.');
      (r.related_verified_cards || []).forEach(function (x) {
        if (codes.indexOf(x) < 0) E('بند الرادار ' + r.code + ' يشير إلى بطاقة موثقة غير موجودة: ' + x);
      });
    });

    (data.cross_index || []).forEach(function (x) {
      (x.related_card_codes || []).forEach(function (rel) {
        if (codes.indexOf(rel) < 0) Wn('الفهرس التقاطعي «' + x.intersection + '» يذكر رمزًا غير موجود: ' + rel);
      });
    });

    var noUpdate = [], noSource = [], otherStatus = [];
    comps.forEach(function (cm, i) {
      var label = cm.name || ('السطر ' + (i + 1));
      var st = cm.verification_status || '';
      if (!st) E('المسابقة/الفعالية «' + label + '» بلا حالة توثيق (موثق رسميًا / قيد التحقق).');
      else if (st.indexOf('قيد التحقق') < 0 && st.indexOf('موثق') < 0) otherStatus.push(label + ': «' + st + '»');
      if (!cm.update_status) noUpdate.push(label);
      if (cm.official_source_url && !URL_RE.test(cm.official_source_url))
        E('المسابقة/الفعالية «' + label + '» تحمل رابطًا غير سليم الصيغة: ' + cm.official_source_url);
      (cm.related_card_codes || []).forEach(function (rel) {
        if (codes.indexOf(rel) < 0) E('المسابقة/الفعالية «' + label + '» تشير إلى بطاقة غير موجودة: ' + rel);
      });
      (cm.source_codes || []).forEach(function (x) {
        if (!srcSet[x]) E('المسابقة/الفعالية «' + label + '» تشير إلى مصدر غير موجود في السجل: [' + x + ']');
      });
      if (!cm.official_source_url && !(cm.source_codes || []).length) noSource.push(label);
    });
    if (noUpdate.length) Wn('مسابقات وفعاليات بلا حالة تحديث (' + noUpdate.length + '): ' + noUpdate.join('، '));
    if (noSource.length) Wn('مسابقات وفعاليات بلا مصدر رسمي مسجّل (' + noSource.length + '): ' + noSource.join('، '));
    if (otherStatus.length) Wn('صياغات حالة توثيق غير معتادة تحتاج مراجعة (' + otherStatus.length +
      ') — حُفظت كما وردت دون إعادة تصنيف: ' + otherStatus.join('؛ '));

    var per = count(cards.map(function (c) { return c.sector_code; }));
    var declared = 0;
    sectors.forEach(function (s) {
      var act = per[s.code] || 0;
      if (s.declared_card_count !== null && s.declared_card_count !== undefined) {
        declared += s.declared_card_count;
        if (s.declared_card_count !== act) E('القطاع ' + s.code + ' (' + s.name + '): العدد المعلن ' + s.declared_card_count + ' والمستخرج ' + act + '.');
      }
    });
    if (axis) {
      var aAct = per[axis.code] || 0;
      if (axis.declared_card_count !== null && axis.declared_card_count !== undefined) {
        declared += axis.declared_card_count;
        if (axis.declared_card_count !== aAct) E('المحور ' + axis.code + ': العدد المعلن ' + axis.declared_card_count + ' والمستخرج ' + aAct + '.');
      }
    }
    if (declared && declared !== cards.length) E('مجموع البطاقات المعلن ' + declared + ' لا يطابق المستخرج ' + cards.length + '.');

    var declaredRadar = null;
    (radar.summary || []).forEach(function (row) {
      if ((row.item || '').indexOf('متبق') >= 0) {
        var d = (row.count || '').replace(/\D/g, '');
        declaredRadar = d ? parseInt(d, 10) : null;
      }
    });
    if (declaredRadar !== null && declaredRadar !== items.length)
      E('عدد بنود الرادار المعلن ' + declaredRadar + ' لا يطابق المستخرج ' + items.length + '.');

    var overlap = codes.filter(function (k) { return items.some(function (r) { return r.code === k; }); });
    if (overlap.length) E('تداخل في الترميز بين البطاقات الموثقة وبنود الرادار: ' + overlap.join('، '));

    return {
      ok: errors.length === 0, errors: errors, warnings: warnings,
      stats: {
        cards: cards.length, sectors: sectors.length, sources: sources.length,
        radar_items: items.length, opportunities: (data.opportunities || []).length,
        competitions: comps.length,
        competitions_verified: comps.filter(function (c) {
          var t = c.verification_status || ''; return t.indexOf('قيد التحقق') < 0 && t.indexOf('موثق') >= 0; }).length,
        competitions_pending: comps.filter(function (c) {
          return (c.verification_status || '').indexOf('قيد التحقق') >= 0; }).length,
        cross_index: (data.cross_index || []).length,
        declared_total_cards: declared || null, declared_radar_items: declaredRadar
      }
    };
  }

  /* ── ٤) الواجهة المعلنة: من ملف مختار ← بيانات + نتيجة تحقق ── */
  function fromFile(file) {
    return file.arrayBuffer().then(function (buf) {
      var name = (file.name || '').toLowerCase();
      if (name.slice(-5) !== '.docx') {
        throw new Error('الملف المختار ليس بصيغة ‎.docx‎. اختر ملف بنك Word المعتمد.');
      }
      var blocks = readDocx(new Uint8Array(buf));
      var data = extract(blocks);
      var result = validate(data);
      var d = file.lastModified ? new Date(file.lastModified) : null;
      data.meta = {
        bank_version: null,                       /* رقم الإصدار غير مثبت داخل المستند */
        word_file: file.name,
        manifest_updated_at: d ? (('0' + d.getDate()).slice(-2) + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + d.getFullYear()) : null,
        source_mode: 'manual',
        source_note: 'تحديث يدوي من ملف اختاره المستخدم — محمّل في هذه الجلسة فقط.',
        validation: { passed: result.ok, errors: result.errors.length, warnings: result.warnings.length }
      };
      return { data: data, validation: result };
    });
  }

  global.BankManual = { fromFile: fromFile, readDocx: readDocx, extract: extract, validate: validate };
})(typeof window !== 'undefined' ? window : this);

، مع الحفاظ على الفرق بين المسابقة التنافسية والهاكاثون والتحدي والبرنامج غير التنافسي. لا تعني الصلة الموضوعية وحدها اعتماد علاقة مع بطاقة محددة في البنك.","تحديث 27-08-2026: توسعت الطبقة من المجموعة الهندسية/الروبوتية الأولية إلى مجالات المياه، الزراعة والغذاء، التقنية الحيوية والصحة، علوم الأرض والجيوفيزياء، الطاقة، الهندسة الكيميائية، الهندسة المدنية، الأمن السيبراني، الإعلام والمعلومات، والذكاء الاصطناعي الجيومكاني. جميع البنود المضافة في هذه الدفعة مستندة إلى صفحات رسمية للجهات المنظمة؛ وتُذكر قيود الأهلية بوضوح حين تكون إقليمية أو وطنية. كما أضيف في رصد 27-08-2026 عدد من الأنشطة والمسابقات والبرامج الموثقة رسميًا من جامعة الملك عبدالعزيز بعد فحص عدم تكرارها في النسخة الحالية. وفي رصد لاحق في التاريخ نفسه، وبعد مطابقة عدم التكرار، أضيف iGOVTHON 2026، وحدث سجل WRO 2026 بفتح التسجيل السعودي عبر موهبة، وأضيف أسبوع المحاكاة الصحي 2026 «SIM FOUND ME». هذه الإضافات تقع ضمن طبقة المسابقات والفعاليات والبرامج ولا تنشئ بطاقات مشكلات جديدة. كما أضافت دورة الرصد اللاحقة في 27-08-2026، بعد المطابقة ضد النسخة المرجعية، أولمبياد الموهبة الوطني 2026، وLEAP 2026، ومسابقة CTF ضمن Black Hat MEA 2026، وتحدي NASA TechLeap «Orbital Clarity Challenge». جميعها أضيفت إلى طبقة الفرص/الفعاليات المرجعية ولا تنشئ بطاقات مشكلات جديدة. وفي رصد 28-08-2026 أضيفت، بعد التحقق من عدم التكرار، فرص: هاكاثون مستقبل التمريض بمستشفى الملك فيصل التخصصي ومركز الأبحاث، وتحدي Emerging Innovators من مسك وHUMAIN، ومسابقة الشباب العالمية للوقاية من الإنفلونزا وكوفيد-19 لدى منظمة الصحة العالمية، ومسابقة Skills in Action Photo Competition لدى UNESCO-UNEVOC. جميعها إضافات إلى طبقة الفرص/الفعاليات ولا تنشئ بطاقات مشكلات جديدة.","تحديث 29-08-2026: أضيفت الدفعة الثانية من برنامج «مدينة تك» (Madinah-Tech) لأمانة منطقة المدينة المنورة بعد التحقق من المصدر الرسمي ومطابقة عدم التكرار. أُدرجت كفرصة ابتكار حضري/مدن ذكية ضمن طبقة الفرص والفعاليات، ولا تنشئ بطاقة مشكلة جديدة.","تحديث 10-09-2026: أضيفت أربعة مستجدات وطنية موثقة رسميًا بعد المطابقة ضد النسخة المرجعية: تحدي «صُنّاع المستقبل: الذكاء الاصطناعي للاستدامة الحي function pool(){
  if(S.mode==='sector')return D.cards.filter(c=>c.code.slice(0,3)===S.key);
  if(S.mode==='dtype')return D.cards.filter(c=>c.dtype===S.key);
  if(S.mode==='scope')return D.cards.filter(c=>c.scope===S.key);
  return D.cards;
}
function matches(c){
  for(const k in S.f){if(S.f[k]&&k!=='tag'&&c[k]!==S.f[k])return false;}
  if(S.f.tag&&!(c.tags||[]).includes(S.f.tag))return false;
  if(S.q){if(!norm(c.code+' '+c.title+' '+c.desc+' '+(c.tags||[]).join(' ')+' '+c.refs+' '+c.sector).includes(norm(S.q)))return false;}
  return true;
}

function srcBlock(s){

      <button class="copybtn" data-copy="${esc(s.code)}">${I('copy',15)}نسخ رمز المصدر</button>
    </div></div>`;
}
function copyText(t){
  const done=()=>toast('نُسخ إلى الحافظة: '+esc(t.length>60?t.slice(0,60)+'…':t));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
  ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('تعذّر النسخ في هذا المتصفح.',true);}
  ta.remove();
}

function compBucket(c){
  const t=(c.status||'').trim();
  if(!t)return 'other';
  if(t.indexOf('موثق')===0)return 'verified';      /* «موثق رسميًا – ترقية من قيد التحقق» موثق */
  if(t.indexOf('قيد التحقق')>=0)return 'pending';
  if(t.indexOf('موثق')>=0)return 'verified';
  return 'other';
}

/* لحظة آخر مصدر حُمِّل بنجاح — تبدأ من تاريخ اللقطة المضمّنة ثم تتحدث عند كل تحميل ناجح */
let LASTSRC=(function(){
  const s=(window.BANK_SNAPSHOT&&window.BANK_SNAPSHOT.snapshot_created_at)||'';
  const m=/^(\d{2})-(\d{2})-(\d{4})(?:[ T](\d{2}):(\d{2}))?/.exec(String(s).trim());
  if(!m)return null;
  const d=new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  return isNaN(d.getTime())?null:d.getTime();
})();
function srcAge(){
  if(!LASTSRC)return '';
  const a=new Date(LASTSRC);a.setHours(0,0,0,0);
  const b=new Date();b.setHours(0,0,0,0);
  let d=Math.round((b-a)/864e5); if(d<0)d=0;
  if(d===0)return 'آخر تحديث اليوم';
  if(d===1)return 'آخر تحديث منذ يوم';
  if(d===2)return 'آخر تحديث منذ يومين';
  if(d<=10)return 'آخر تحديث منذ '+AR(d)+' أيام';
  if(d<30)return 'آخر تحديث منذ '+AR(d)+' يومًا';
  const mo=Math.floor(d/30);
  if(mo===1)return 'آخر تحديث منذ شهر';
  if(mo===2)return 'آخر تحديث منذ شهرين';
  if(mo<=10)return 'آخر تحديث منذ '+AR(mo)+' أشهر';
  return 'آخر تحديث منذ '+AR(mo)+' شهرًا';
}

function toast(msg,warn,withWarnings){
  const old=document.querySelector('.toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast'+(warn?' warn':'');
  d.innerHTML=I(warn?'warn':'info',17)+'<span>'+msg+'</span>'+
    (withWarnings?'<button data-warn="1" class="tlink">عرض التنبيهات</button>':'');
  document.body.appendChild(d);
  setTimeout(()=>{if(d.parentNode)d.remove();},withWarnings?11000:5600);
}

/* ══ التحديث: زر واحد ← منتقي ملفات ← قراءة محلية ← تحقق ← عرض ══ */
let MANUAL=null;                 /* آخر ملف اجتاز التحقق — في الذاكرة فقط */
let LASTWARN=[];                 /* تنبيهات غير مؤثرة من آخر تحميل ناجح */
const canParse=()=>!!(window.BankManual&&window.fflate);

function panel(title,sub,items,kind,actions){
  const w=document.createElement('div');w.className='vbox';
  const acts=(actions||[]).map(a=>
    `<button class="pick wide" data-act2="${a.act}" data-close="1"><span class="pn">${I(a.icon||'registry',18)} ${a.label}</span></button>`).join('');
  w.innerHTML=`<div class="vcard"><h3 class="${kind==='bad'?'bad':(kind==='warn'?'warnt':'')}">${title}</h3>
    <p class="vsub">${sub}</p>
    ${(items&&items.length)?`<ul class="vlist">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${acts?`<div class="picks" style="margin:14px 0 2px">${acts}</div>`:''}
    <button class="fbtn" data-close="1">إغلاق</button></div>`;
  w.addEventListener('click',ev=>{if(ev.target===w||ev.target.closest('[data-close]'))w.remove();});
  document.body.appendChild(w);
}
function showWarnings(){
  if(!LASTWARN.length)return;
  panel('تنبيهات غير مؤثرة','لم تمنع هذه الملاحظات تحميل المحتوى، والمعروض سليم.',LASTWARN,'warn');
}
function fileDate(f){
  if(!f||!f.lastModified)return '';
  const d=new Date(f.lastModified),p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear();
}

/* منتقي الملفات هو المسار المضمون في كل متصفح */
function manualPick(){
  if(!canParse()){
    return panel('تعذّر تشغيل قارئ ملفات Word','لم تُحمَّل الأدوات المرفقة مع مجلد البنك.',
      ['تأكّد من وجود مجلدي assets و tools بجوار ملف Bank_UI.html، ومن فتح الملف من داخل مجلد Bank.'],'bad');
  }
  const fallback=()=>document.getElementById('pick').click();
  if(typeof window.showOpenFilePicker==='function'){
    try{
      window.showOpenFilePicker({multiple:false,types:[{description:'ملف بنك بصيغة Word',accept:{'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx']}}]})
        .then(hs=>{const h=hs&&hs[0];if(!h)return;return h.getFile().then(f=>{HANDLE=h;manualLoad(f);});})
        .catch(err=>{ if(err&&err.name==='AbortError')return;   /* إلغاء المستخدم: لا شيء يتغيّر */
                      fallback(); });                            /* أي تعذّر آخر: المنتقي المضمون */
      return;
    }catch(e){ /* يسقط إلى المنتقي المضمون */ }
  }
  fallback();
}
/* إعادة قراءة الملف نفسه: اختيارية، داخل الجلسة فقط، بإذن ممنوح أصلًا */
function rereadSame(){
  if(!HANDLE)return;
  HANDLE.getFile().then(f=>manualLoad(f))
    .catch(()=>{HANDLE=null;stamp();panel('تعذّرت إعادة القراءة','لم يتغيّر المحتوى المعروض.',['اضغط «تحديث المحتوى» واختر الملف من جديد.'],'bad');});
}
function manualLoad(file,auto){
  const btn=document.getElementById('update');
  btn.disabled=true;btn.innerHTML=I('refresh',16)+'جارٍ القراءة…';
  const done=()=>{btn.disabled=false;btn.innerHTML=I('refresh',16)+'تحديث المحتوى';stamp();};
  window.BankManual.fromFile(file).then(res=>{
    const v=res.validation;
    if(!v.ok){                                   /* أخطاء موقِفة: لا يُستبدل المعروض */
      done();
      if(auto){AUTOFAIL='لم يجتز المصدر الحالي التحقق.';render();return;}
      return panel('لم يجتز الملف التحقق','لم يُغيَّر المحتوى المعروض. الملف المختار: '+esc(file.name),
        v.errors.slice(0,25).concat(v.errors.length>25?['… و'+(v.errors.length-25)+' خطأ آخر.']:[]),'bad');
    }
    const next=adapt(res.data);
    if(!next){done();return panel('تعذّر استخدام محتوى الملف','لم يُغيَّر المحتوى المعروض.',['لم تُستخرج بطاقات صالحة من الملف المختار.'],'bad');}
    MANUAL={data:res.data,file:file.name};
    SRCFILE={name:file.name,date:fileDate(file)};
    LASTSRC=Date.now();
    D=next;D.meta=res.data.meta;loaded=new Set(D.loaded);
    S={v:'home',mode:null,key:null,q:'',f:{},code:null,facets:false,from:null,open:null,fq:{},fall:{},cq:''};
    LASTWARN=v.warnings||[];
    done();
    const mt=document.getElementById('mtool');
    if(mt)mt.classList.remove('on');
    const mb=document.getElementById('mtoolbtn');
    if(mb){mb.setAttribute('aria-expanded','false');mb.blur();}
    render();
    const n=v.stats||{},w=LASTWARN.length;
    let msg=(auto?'تم عرض البنك من اللقطة المضمّنة — ':'تم تحديث محتوى البنك في هذه الجلسة — ')+
      (n.cards||0)+' بطاقة موثقة، '+(n.radar_items||0)+' تحديًا واعدًا، '+(n.competitions||0)+' مسابقة وفعالية';
    if(w)msg+='، '+w+' تنبيه غير مؤثر';
    toast(msg+'.',false,w>0);
  }).catch(err=>{
    done();
    if(auto){AUTOFAIL=String(err&&err.message||err);render();return;}  /* لا لوحة توقِف الفتح */
    panel('تعذّرت قراءة الملف','لم يُغيَّر المحتوى المعروض.',[String(err&&err.message||err)],'bad');
  });
}
/* ══ محاولة قراءة المصدر الحالي تلقائيًا عند الفتح ══
   تنجح حين يسمح المتصفح بقراءة ملف مجاور (مثلًا عند تقديم المجلد عبر خادم)،
   وتفشل بهدوء في وضع file:// لأن المتصفح يمنع ذلك لأسباب أمنية. لا نافذة ولا منتقي إجباري. */
let AUTOFAIL=null;
/* نسخة مستقلة: لا fetch ولا ملفات مجاورة — تُعرض اللقطة المضمّنة فور الفتح */
function autoLoadSource(){
  const B=window.BANK_DATA, S2=window.BANK_SNAPSHOT||{};
  const next=adapt(B);
  if(!next){AUTOFAIL='تعذّر قراءة اللقطة المضمّنة.';render();return;}
  D=next;D.meta=B.meta||{};loaded=new Set(D.loaded);
  SRCFILE={name:S2.source_filename||'Current_Bank.docx',date:S2.snapshot_created_at||''};
  LASTWARN=S2.warnings||[];
  stamp();render();
}

  const pick=e.target.closest('[data-fpick]');
  if(pick){e.stopPropagation();
    const k=pick.dataset.fpick, v=pick.dataset.v, fk=FKEY[k];
    S.f=Object.assign({},S.f); S.f[fk]=(S.f[fk]===v||v==='')?null:v;
    S.open=null;                                  /* الاختيار يُغلق اللوحة ويعيد الحالة المضغوطة */
    KEEP=true; return render();}
  const more=e.target.closest('[data-fall]');
  if(more){e.stopPropagation();S.fall[more.dataset.fall]=true;KEEP=true;return render();}
  const clr=e.target.closest('[data-fclear]');
  if(clr){e.stopPropagation();const k=clr.dataset.fclear;
    S.f=Object.assign({},S.f);
    if(k==='all'){S.f.cstat=S.f.cdomain=S.f.corg=S.f.ctype=null;S.cq='';} else {S.f[FKEY[k]]=null;}

  if(e.target.closest('[data-more]')){e.stopPropagation();return moreSheet();}
  const sh=e.target.closest('[data-csheet]');
  if(sh){e.stopPropagation();return openSheet(+sh.dataset.csheet);}

  if(e.target.closest('[data-sclose]')){e.stopPropagation();return closeSheet();}

  if(!t)return;

  if(t.id==='clr'){S.q='';S.f={};S.favonly=false;return render();}

  if(t.dataset.tag){S.f={tag:t.dataset.tag};S.facets=true;S.from=null;S.v='list';return render();}
  if(t.dataset.cf){const k=t.dataset.cf,v=t.dataset.v;S.f=Object.assign({},S.f);
    if(k==='cstat'){S.f.cstat=v||null;}
    else if(k==='cdomall'){S.f.cdomall=true;}
    else{S.f[k]=S.f[k]===v?null:v;}
    return render();}
  if(t.dataset.relc){closeSheet();S.code=t.dataset.relc;S.from='comps';S.mode='sector';S.key=t.dataset.relc.slice(0,3);S.v='card';return render();}
  if(t.dataset.rel){S.code=t.dataset.rel;S.from='radar';S.mode='sector';S.key=t.dataset.rel.slice(0,3);S.v='card';return render();}
  if(t.dataset.code){S.code=t.dataset.code;S.from=null;S.v='card';return render();}
  if(t.dataset.key){S.key=t.dataset.key;S.q='';S.f={};S.facets=false;S.from=null;S.v='list';return render();}
  if(t.dataset.mode){S.mode=t.dataset.mode;S.v='pick';return render();}

/* ── البحّاثة الشاملة: بحث فوري عبر كل الأقسام من البيانات المحمّلة وحدها ── */
let PAL=[],PALI=0;
function palBuild(q){
  const nq=norm(q||''),out=[],cap=(a,n)=>a.slice(0,n);
  NAV.forEach(x=>{if(!nq||norm(x.t).includes(nq))out.push({g:'الأقسام',ic:x.ic,l:x.t,s:'انتقال إلى القسم',go:x.v});});
  if(D&&nq){
    cap(D.cards.filter(c=>norm(c.code+' '+c.title+' '+c.sector+' '+(c.tags||[]).join(' ')).includes(nq)),12)
      .forEach(c=>out.push({g:'التحديات الموثقة',ic:typeIcon(c.dtype),l:c.title,s:c.code+' · '+c.sector,code:c.code}));
    cap((D.competitions||[]).map((c,i)=>({c:c,i:i})).filter(o=>norm([o.c.name,o.c.organizer,(o.c.domains||[]).join(' ')].join(' ')).includes(nq)),8)
      .forEach(o=>out.push({g:'مسابقات وفعاليات',ic:'trophy',l:o.c.name||'',s:o.c.organizer||'نشاط في الطبقة',comp:o.i,gold:compBucket(o.c)!=='verified'}));
    cap(D.radar.filter(r=>norm(r.code+' '+r.title+' '+r.group).includes(nq)),8)
      .forEach(r=>out.push({g:'التحديات الواعدة',ic:'radar',l:r.title,s:r.code+' · '+r.group,go:'radar',gold:true}));
    cap(Object.values(D.sources).filter(s=>norm(s.code+' '+s.name).includes(nq)),8)
      .forEach(s=>out.push({g:'سجل المصادر',ic:'registry',l:s.name,s:'رمز المصدر '+s.code,go:'sources'}));
    cap((D.opp||[]).filter(o=>norm(o.name+' '+o.topic).includes(nq)),6)
      .forEach(o=>out.push({g:'الفرص الحديثة',ic:'opportunity',l:o.name,s:o.topic,go:'opp'}));
  }
  return out;
}
function palRender(){
  const box=document.getElementById('pres');if(!box)return;
  if(!PAL.length){box.innerHTML=`<div class="pempty">${D?'لا نتيجة مطابقة في المحتوى المحمّل.':'ابحث في الأقسام، أو حمّل ملف المصدر للبحث في محتواه.'}</div>`;return;}
  let g=null,h='';
  PAL.forEach((x,i)=>{
    if(x.g!==g){g=x.g;h+=`<div class="pgrp">${g}</div>`;}
    h+=`<button class="pitem${i===PALI?' sel':''}${x.gold?' gold':''}" data-pi="${i}">
      <span class="pic">${I(x.ic,17)}</span>
      <span class="pb"><span class="pl">${esc(x.l)}</span><span class="ps">${esc(x.s)}</span></span>
      <span class="pg">${I('go',16)}</span></button>`;
  });
  box.innerHTML=h;
  const sel=box.querySelector('.pitem.sel');
  if(sel){const r=sel.getBoundingClientRect(),b=box.getBoundingClientRect();
    if(r.bottom>b.bottom)box.scrollTop+=r.bottom-b.bottom;
    if(r.top<b.top)box.scrollTop-=b.top-r.top;}
}
function palOpen(){
  let el=document.getElementById('pal');
  if(!el){el=document.createElement('div');el.id='pal';el.className='pal';document.body.appendChild(el);}
  el.innerHTML=`<div class="pbd" data-pclose="1"></div>
    <div class="pbox" role="dialog" aria-modal="true" aria-label="بحث شامل">
      <div class="phead">${I('search',19)}
        <input id="pq" type="search" autocomplete="off" placeholder="ابحث في كل أقسام البنك…" aria-label="بحث شامل">
        <kbd>Esc</kbd></div>
      <div class="pres" id="pres"></div>
      <div class="pfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> <b>تنقل</b></span><span><kbd>Enter</kbd> <b>انتقال</b></span>
        <span><kbd>Alt</kbd>+<kbd>1..8</kbd> <b>الأقسام</b></span><span><kbd>؟</kbd> <b>الاختصارات</b></span></div>
    </div>`;
  PAL=palBuild('');PALI=0;palRender();
  el.classList.add('on');setTimeout(()=>el.classList.add('in'),16);
  const inp=document.getElementById('pq');
  setTimeout(()=>inp&&inp.focus(),60);
  inp.addEventListener('input',()=>{PAL=palBuild(inp.value.trim());PALI=0;palRender();});
}
function palClose(){
  const el=document.getElementById('pal');if(!el)return;
  el.classList.remove('in');setTimeout(()=>{el.classList.remove('on');el.innerHTML='';},220);
}
function palRun(i){
  const x=PAL[i];if(!x)return;palClose();
  if(x.code){S.code=x.code;S.from=null;S.mode='sector';S.key=x.code.slice(0,3);S.v='card';return render();}
  if(x.comp!=null){S.v='comps';render();return setTimeout(()=>openSheet(x.comp),80);}
  if(x.go){S.v=x.go;if(S.v==='home'){S.mode=null;S.key=null;S.q='';S.f={};S.from=null;}return render();}
}

/* ── ربط التفاعل — مستقل عن معالجات التطبيق القائمة ── */
document.addEventListener('click',e=>{
  const pi=e.target.closest('[data-pi]');
  if(pi){e.stopPropagation();return palRun(+pi.dataset.pi);}
  if(e.target.closest('[data-pclose]')){e.stopPropagation();return palClose();}
  if(e.target.closest('[data-pal]')){e.stopPropagation();return palOpen();}
  if(e.target.closest('[data-help]')){e.stopPropagation();return shortcutsSheet();}
  const fv=e.target.closest('[data-fav]');
  if(fv){e.stopPropagation();const k=fv.dataset.fav;
    FAV.has(k)?FAV.delete(k):FAV.add(k);
    if(document.querySelector('.sheet.on'))closeSheet();
    KEEP=true;return render();}
  const pk=e.target.closest('[data-peek]');
  if(pk){e.stopPropagation();return openCardSheet(pk.dataset.peek);}
  const op=e.target.closest('[data-open]');
  if(op){e.stopPropagation();closeSheet();S.code=op.dataset.open;S.from=null;S.mode='sector';S.key=op.dataset.open.slice(0,3);S.v='card';return render();}
  const lc=e.target.closest('[data-lclear]');
  if(lc){e.stopPropagation();const k=lc.dataset.lclear;
    if(k==='all'){S.q='';S.f={};S.favonly=false;}
    else if(k==='q')S.q='';
    else if(k==='fav')S.favonly=false;
    else {S.f=Object.assign({},S.f);S.f[k]=null;}
    KEEP=true;return render();}
  if(e.target.closest('#tfav')){e.stopPropagation();S.favonly=!S.favonly;KEEP=true;return render();}
});
document.addEventListener('keydown',e=>{
  const pal=document.getElementById('pal'),palOn=pal&&pal.classList.contains('on');
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(palOn){
    if(e.key==='Escape'){e.preventDefault();return palClose();}
    if(e.key==='ArrowDown'){e.preventDefault();PALI=Math.min(PALI+1,PAL.length-1);return palRender();}
    if(e.key==='ArrowUp'){e.preventDefault();PALI=Math.max(PALI-1,0);return palRender();}
    if(e.key==='Enter'){e.preventDefault();return palRun(PALI);}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();return palOpen();}
  if(e.key==='/'&&!typing){e.preventDefault();return palOpen();}
  if((e.key==='?'||e.key==='؟')&&!typing){e.preventDefault();return shortcutsSheet();}
  if(e.altKey&&/^[1-8]$/.test(e.key)){const x=NAV[+e.key-1];
    if(x){e.preventDefault();S.v=x.v;if(S.v==='home'){S.mode=null;S.key=null;S.q='';S.f={};S.from=null;}return render();}}
});
document.querySelector('[data-pal]').innerHTML=I('search',17)+'<span class="pt">بحث شامل</span><kbd>Ctrl K</kbd>';

document.getElementById('pick').accept='.docx';
stamp();render();            /* الواجهة تفتح كاملة أولًا — لا شاشة إعداد ولا مطالبة بالتحديث */
autoLoadSource();            /* ثم تُحاول قراءة المصدر الحالي بهدوء */
</script>
</body>
</html>
