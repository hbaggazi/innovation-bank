<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنك المسابقات والتحديات الابتكارية</title>
<style>
/* ═══ رموز التصميم المعتمدة — منقولة من References/Approved_UI_Design/tokens.css ═══ */
:root{
  /* green */
  --g-950:#0d3f28; --g-900:#0f3f29; --g-850:#0f4b2f; --g-800:#12603c;
  --g-700:#15734a; --g-650:#1a7d50; --g-600:#1b6b47; --g-575:#155a3b;
  --g-500:#4aa878; --g-300:#cfe6da; --g-200:#d6e9dd; --g-100:#eaf5ee;
  --g-075:#eef4f0; --g-050:#f4faf6; --g-040:#f5f9f7; --g-030:#fafcfb; --g-025:#f3f8f5;
  /* gold — accent only */
  --gold-600:#b98f21; --gold-500:#c9a442; --gold-400:#e3c473; --gold-300:#e6c168;
  --gold-100:#fdf6e3; --gold-075:#fdf3dc; --gold-050:#fdf9ef;
  --gold-bd-1:#f2e6c4; --gold-bd-2:#f0e2bd; --gold-bd-3:#e2d7b4;
  --gold-tx-1:#7d6112; --gold-tx-2:#6b5c33; --gold-tx-3:#8a6d17;
  /* text */
  --tx-title:#123c28; --tx-sub:#1c4a34; --tx-strong:#204a35; --tx-body:#5b7568;
  --tx-2:#6b8478; --tx-3:#7d9187; --tx-meta:#8fa398; --tx-4:#9db0a5;
  --tx-placeholder:#a3b4aa; --tx-chevron:#b9cdc2; --tx-empty:#c2cfc7;
  /* surfaces & borders */
  --surface:#ffffff; --bd:#e7efea; --bd-strong:#e4ede8; --bd-control:#e2ebe6;
  --bd-strip:#eaf1ed; --bd-inner:#f0f5f2; --bd-row:#f3f7f5;
  /* on dark (sidebar) */
  --on-dark-sel:rgba(226,255,236,.16); --on-dark-card:rgba(226,255,236,.09);
  --on-dark-bd:rgba(226,255,236,.16); --on-dark-label:rgba(224,241,231,.80);
  --on-dark-label-active:#ffffff; --on-dark-count:rgba(255,255,255,.10);
  --on-dark-count-tx:rgba(224,241,231,.65); --on-dark-count-active:rgba(230,193,104,.22);
  --on-dark-count-active-tx:#f0dca8; --on-dark-dot:#7fd6a2;
  /* gradients */
  --grad-sidebar:linear-gradient(178deg,#1b6b47 0%,#155a3b 42%,#0d3f28 100%);
  --grad-btn:linear-gradient(165deg,#1a7d50,#12603c);
  --grad-logo:linear-gradient(160deg,#1d7a4f,#0f4b2f);
  --grad-hero:linear-gradient(120deg,#f4faf6 0%,#ffffff 58%);
  --grad-progress:linear-gradient(270deg,#1a7d50,#4aa878);
  --grad-progress-gold:linear-gradient(270deg,#7fd6a2,#e6c168);
  --grad-alert:linear-gradient(120deg,#fdf9ef,#ffffff 70%);
  --grad-gold-rail:linear-gradient(180deg,#e3c473,#c9a442);
  --grad-wave-veil:linear-gradient(190deg,#eef7f1 0%,rgba(238,247,241,0) 82%);
  /* shadows */
  --sh-chip:0 4px 14px rgba(16,60,40,.05);
  --sh-card:0 6px 18px rgba(16,60,40,.05);
  --sh-hero:0 12px 34px rgba(16,60,40,.06);
  --sh-float:0 8px 22px rgba(16,60,40,.07);
  --sh-btn:0 5px 14px rgba(18,96,60,.26);
  --sh-logo:0 6px 18px rgba(15,75,47,.22);
  --sh-alert:0 6px 18px rgba(120,95,20,.07);
  /* radii */
  --r-control:10px; --r-btn:11px; --r-kanban:13px; --r-inner:14px;
  --r-strip:16px; --r-panel:18px; --r-hero:22px; --r-pill:20px;
  /* type — خط محلي فقط: لا خطوط من الإنترنت */
  --font:'IBM Plex Sans Arabic','SF Arabic','Geeza Pro','Segoe UI',Tahoma,'Noto Naskh Arabic',system-ui,sans-serif;
  --fs-hero:40px; --fs-brand:23px; --fs-h2:21px; --fs-panel:17px; --fs-card:15.5px;
  --fs-stat:19px; --fs-kpi:27px; --fs-nav:14px; --fs-body:13.5px; --fs-2:12.5px;
  --fs-meta:11.5px; --fs-micro:10.5px;
  /* layout */
  --sidebar-w:258px; --page-pad-x:34px; --wave-h:230px;

  /* ربط الأسماء القائمة في التطبيق بالرموز المعتمدة */
  --green:var(--g-900); --green-d:var(--g-950); --green-2:var(--g-700); --green-3:var(--g-500);
  --green-4:var(--g-200); --pale:var(--g-100); --pale-2:var(--g-050); --pale-3:var(--g-030);
  --ink:var(--tx-title); --muted:var(--tx-2); --line:var(--bd); --line-2:var(--bd-control);
  --sand:var(--gold-075); --sand-line:var(--gold-bd-2); --sand-ink:var(--gold-tx-1); --sand-2:var(--gold-050);
  --gold:var(--gold-500); --app-bg:#ffffff;
  --shadow:var(--sh-chip); --shadow-2:var(--sh-card); --side-w:var(--sidebar-w);
}
.ltr-iso{direction:ltr;unicode-bidi:isolate}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fff;color:var(--ink);
  font-family:var(--font);
  font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
a{color:var(--green-2)}
:focus-visible{outline:2px solid var(--green-2);outline-offset:3px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 28px}
.mono{font-family:ui-monospace,SFMono-Regular,monospace;direction:ltr;display:inline-block}
svg{flex:0 0 auto}

/* شريط النموذج */
.mockbar{border-bottom:1px solid var(--line);background:var(--pale-3);font-size:12.5px;color:var(--muted);padding:8px 0;line-height:1.6}

/* الترويسة */
header.top{border-bottom:1px solid var(--green-4);background:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 rgba(12,55,40,.03)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}
.hometitle{display:flex;align-items:center;gap:11px;text-align:start}
.hometitle .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--green-2),var(--green));color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(12,55,40,.18)}
.hometitle .tx{font-size:15px;font-weight:700;color:var(--green);line-height:1.35}
.hometitle .tx span{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.backlink{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--green-2);border:1px solid var(--line-2);border-radius:22px;padding:6px 14px}
.backlink:hover{background:var(--pale-2);border-color:var(--green-3)}

.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--green-2);background:var(--pale-2);border:1px solid var(--line-2);border-radius:20px;padding:4px 12px}
.verchip.warn{color:var(--sand-ink);background:var(--sand-2);border-color:var(--sand-line)}
.upbtn{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#fff;background:var(--green);border-radius:22px;padding:7px 15px}
.upbtn:hover{background:var(--green-2)}
.upbtn[disabled]{opacity:.55;cursor:default}
[hidden]{display:none!important}
.upbtn.alt{background:#fff;color:var(--green-2);border:1px solid var(--line-2)}
.upbtn.alt:hover{background:var(--pale-2)}
.menuwrap{position:relative}
.menubtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line-2);border-radius:50%;color:var(--green-2)}
.menubtn:hover{background:var(--pale-2);border-color:var(--green-3)}
.menu{position:absolute;inset-block-start:42px;inset-inline-start:0;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:6px;min-width:270px;box-shadow:0 8px 28px rgba(14,59,44,.10);z-index:50;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:start;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--ink);line-height:1.6}
.menu button:hover{background:var(--pale-2)}
.menu button svg{color:var(--green-3);margin-top:4px}
.menu button small{display:block;font-size:12.5px;color:var(--muted);line-height:1.6}
.menu .msep{height:1px;background:var(--line);margin:5px 8px}
.vbox{position:fixed;inset:0;background:rgba(14,33,29,.34);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.vcard{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:26px 28px}
.vcard h3{margin:0 0 6px;font-size:21px;color:var(--green)}
.vcard h3.bad{color:#8a3b2e}
.vcard p.vsub{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.vlist{margin:0 0 18px;padding:0;list-style:none;font-size:14.5px}
.vlist li{padding:9px 0;border-top:1px solid var(--line);line-height:1.7}
.toast{position:fixed;inset-block-end:22px;inset-inline-start:22px;background:var(--green);color:#fff;font-size:14px;padding:11px 18px;border-radius:12px;z-index:60;display:flex;gap:9px;align-items:center;max-width:min(520px,92vw);line-height:1.6}
.toast.warn{background:var(--sand-ink)}
.toast .tlink{color:#fff;text-decoration:underline;font-size:13.5px;white-space:nowrap;padding:0 2px}
.vcard h3.warnt{color:var(--sand-ink)}

/* الموجات */
.waves{position:absolute;inset-inline:0;bottom:0;height:340px;overflow:hidden;pointer-events:none;z-index:0}
.waves svg{width:100%;height:100%;display:block}
.stage{position:relative}
.stage>.wrap{position:relative;z-index:1}

/* عناوين الشاشات */
.q{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--green-3);margin:0 0 8px}
h1.screen{font-size:34px;line-height:1.4;margin:0 0 10px;color:var(--green);font-weight:700}
p.sub{margin:0 0 40px;color:var(--muted);font-size:16px;max-width:62ch}
.count{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:0 0 22px}

/* الرئيسة */
.home{padding:80px 0 92px}
.home h1{font-size:40px;line-height:1.35;margin:0 0 14px;color:var(--green);font-weight:700}
.home p.one{font-size:18px;color:var(--muted);margin:0 0 48px;max-width:56ch}
.twochoices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:44px}
.big{border:1px solid var(--line-2);border-radius:20px;padding:30px 28px;text-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:14px;transition:.18s;background:var(--pale-2)}
.big:hover{border-color:var(--green);background:var(--pale);transform:translateY(-2px)}
.big .ic{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;border:1px solid var(--line-2)}
.big .bt{font-size:22px;font-weight:700;color:var(--green);display:block}
.big .bd{font-size:14.5px;color:var(--muted);display:block;line-height:1.7;margin-top:4px}
.big .go{font-size:14px;color:var(--green-2);display:inline-flex;align-items:center;gap:7px;margin-top:2px}
.big.sandy{background:var(--sand-2);border-color:var(--sand-line)}
.big.sandy:hover{background:var(--sand);border-color:var(--sand-ink)}
.big.sandy .ic{color:var(--sand-ink);border-color:var(--sand-line)}
.big.sandy .bt,.big.sandy .go{color:var(--sand-ink)}

.secondary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:24px;margin-top:4px;border-top:1px solid var(--line)}
@media(max-width:860px){.secondary{grid-template-columns:minmax(0,1fr)}}
.snav{display:flex;align-items:center;gap:11px;padding:14px 16px;border-radius:16px;font-size:14.5px;color:var(--ink);
  text-align:start;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:.16s}
.snav svg{color:var(--green-3)}
.snav:hover{background:var(--pale-2);color:var(--green);border-color:var(--green-4);box-shadow:var(--shadow-2)}

/* ثلاثة مداخل */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.opt{border:1px solid var(--line-2);border-radius:18px;padding:26px 22px;text-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:12px;transition:.18s;background:#fff}
.opt:hover{border-color:var(--green);background:var(--pale-2);transform:translateY(-2px)}
.opt .ic{width:48px;height:48px;border-radius:50%;background:var(--pale);color:var(--green);display:grid;place-items:center}
.opt .ot{font-size:19px;font-weight:700;color:var(--green);display:block}
.opt .od{font-size:14px;color:var(--muted);display:block;margin-top:3px}

/* اختيار */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{border:1px solid var(--line);border-radius:14px;padding:15px 17px;text-align:start;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.18s;background:#fff}
.pick:hover{border-color:var(--green-3);background:var(--pale-2)}
.pick .pn{font-size:16px;line-height:1.5;color:var(--ink)}
.pick .pc{font-size:13.5px;color:var(--green-2);background:var(--pale);border-radius:20px;padding:1px 11px;flex:0 0 auto}
.pick[data-loaded="0"] .pn{color:var(--muted)}
.pick[data-loaded="0"] .pc{background:#f2f4f3;color:var(--muted)}
.pick.wide{grid-column:1/-1;background:var(--pale-3);border-color:var(--line-2)}
.axisnote{display:flex;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}
.axisnote svg{color:var(--green-3);margin-top:5px}

/* أدوات القائمة */
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.searchwrap{flex:1 1 250px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:6px 2px}
.searchwrap:focus-within{border-bottom-color:var(--green)}
.searchwrap svg{color:var(--green-3)}
.searchwrap input{flex:1;border:0;background:none;font:inherit;font-size:15px;padding:2px 0}
.searchwrap input:focus{outline:0}
.tbtn{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);border:1px solid var(--line-2);border-radius:20px;padding:5px 13px}
.tbtn:hover{color:var(--green);border-color:var(--green-3);background:var(--pale-2)}
.tbtn.on{color:var(--green);border-color:var(--green-3);background:var(--pale)}
.facets{padding:16px 0 8px;border-bottom:1px solid var(--line);display:none;background:var(--pale-3);border-radius:0 0 12px 12px;margin-bottom:2px}
.facets.on{display:block}
.facets .inner{padding:0 14px}
.fg{display:flex;gap:10px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
.fg .fl{font-size:13px;color:var(--green-2);min-width:92px}
.chip{border:1px solid var(--line-2);border-radius:20px;padding:3px 13px;font-size:13.5px;color:var(--muted);background:#fff}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip:hover{border-color:var(--green-3)}

/* قائمة البطاقات */
.list{margin:0;padding:0;list-style:none}
.row{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px;transition:transform .16s,box-shadow .16s,border-color .16s}
.row:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--green-2)}
.row button{display:flex;gap:14px;width:100%;text-align:start;padding:18px 18px;border-radius:16px;transition:background .15s}
.row button:hover{background:transparent}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--pale-2);color:var(--green-3);display:grid;place-items:center;margin-top:4px}
.row button:hover .ic{background:#fff;color:var(--green)}
.row .body{flex:1;min-width:0}
.row .rc{display:block;font-size:12.5px;color:var(--green-3);letter-spacing:.4px}
.row .rt{display:block;font-size:19px;font-weight:700;line-height:1.6;margin:1px 0 6px;color:var(--ink)}
.row .rm{display:block;font-size:13.5px;color:var(--muted)}
.row .rm b{font-weight:600;color:var(--green-2)}
.row .chev{color:var(--line-2);align-self:center}
.row button:hover .chev{color:var(--green-3)}
.sep{color:#c6d2cd;padding:0 8px}

/* البطاقة الكاملة */
.full{max-width:780px}
.full .fc{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--green-2);background:var(--pale);border-radius:20px;padding:3px 13px}
.full h1{font-size:31px;line-height:1.55;color:var(--green);margin:14px 0 18px;font-weight:700}
.meta{display:flex;gap:22px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:32px}
.meta span{display:inline-flex;align-items:center;gap:8px}
.meta svg{color:var(--green-3)}
.meta b{color:var(--ink);font-weight:600}
.blk{margin-bottom:32px}
.blk .bl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--green-2);margin-bottom:12px}
.blk .bl svg{color:var(--green-3)}
.blk p.desc{margin:0;font-size:18px;line-height:2;border-inline-start:3px solid var(--pale);padding-inline-start:18px}
.src{padding:16px 18px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)}
.src:hover{box-shadow:var(--shadow-2)}
.src .sc{font-size:13px;color:var(--green-2)}
.src .sn{font-size:16px;line-height:1.7;display:block;margin:2px 0 6px}
.src a{display:inline-flex;align-items:center;gap:7px;font-size:14px;text-decoration:none}
.src a:hover{text-decoration:underline}
.src .url{display:none;direction:ltr;font-size:11.5px;color:var(--muted);word-break:break-all;font-family:ui-monospace,monospace}
.note{display:flex;gap:9px;font-size:13.5px;color:var(--muted);margin-top:12px}
.note svg{color:var(--green-3);margin-top:5px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:20px;padding:3px 13px;font-size:14px;color:var(--muted)}
.tags button:hover{border-color:var(--green-3);color:var(--green);background:var(--pale-2)}
.tags svg{color:var(--green-3)}
.foot{border-top:1px solid var(--line);padding-top:20px;display:flex;gap:12px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--green-2);border:1px solid var(--line-2);border-radius:22px;padding:7px 15px}
.fbtn:hover{background:var(--pale-2);border-color:var(--green-3)}

/* التحديات الواعدة */
.radarband{background:var(--sand-2);border:1px solid var(--sand-line);border-radius:18px;padding:22px 24px;margin-bottom:30px;display:flex;gap:16px}
.radarband .ic{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--sand-line);color:var(--sand-ink);display:grid;place-items:center}
.radarband .rl{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--sand-ink);border:1px solid var(--sand-line);border-radius:20px;padding:2px 12px;background:#fff;margin-bottom:10px}
.radarband p{margin:0;font-size:15px;color:var(--sand-ink);line-height:1.85}
h3.grp{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--sand-ink);font-weight:600;margin:32px 0 4px}
h3.grp svg{color:var(--sand-ink)}
.rrow{border:1px solid var(--sand-line);border-radius:16px;padding:20px 22px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow);transition:box-shadow .16s}
.rrow:hover{box-shadow:var(--shadow-2)}
.rrow .rc{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sand-ink);background:var(--sand);border-radius:20px;padding:2px 11px}
.rrow .rt{font-size:19px;font-weight:700;line-height:1.6;margin:9px 0 8px}
.rrow .rm{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.rel{border-top:1px solid var(--line);padding-top:13px;margin-bottom:12px}
.rel .rl2{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--green-2);margin-bottom:9px}
.rel .rl2 svg{color:var(--green-3)}
.relcodes{display:flex;gap:8px;flex-wrap:wrap}
.relcode{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:20px;padding:4px 13px;font-size:13.5px;color:var(--green-2);background:var(--pale-2)}
.relcode:hover{background:var(--green);border-color:var(--green);color:#fff}
.relcode:hover svg{color:#fff}
.relcode svg{color:var(--green-3)}
.relcode.off{color:var(--muted);background:#f5f6f6;border-color:var(--line);cursor:default}
.relcode.off svg{display:none}
.rrow .rw{font-size:14.5px;color:var(--muted);line-height:1.85}
.rrow .rwl{font-size:13px;color:var(--sand-ink);margin-bottom:2px}

/* المسابقات والفعاليات */
.wide-entry{display:flex;align-items:center;gap:16px;width:100%;text-align:start;border:1px solid var(--line-2);border-radius:16px;padding:18px 22px;background:#fff;transition:.18s;margin-bottom:30px}
.wide-entry:hover{border-color:var(--green);background:var(--pale-2)}
.wide-entry .ic{width:44px;height:44px;border-radius:13px;background:var(--pale);color:var(--green);display:grid;place-items:center}
.wide-entry .wt{font-size:17.5px;font-weight:700;color:var(--green);display:block}
.wide-entry .wd{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.wide-entry .wc{margin-inline-start:auto;font-size:13.5px;color:var(--green-2);background:var(--pale);border-radius:20px;padding:2px 12px;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:22px;padding:6px 15px;font-size:14px;color:var(--muted);background:#fff}
.tab:hover{border-color:var(--green-3)}
.tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.tab[aria-pressed="true"] svg{color:#fff}
.tab.sandy[aria-pressed="true"]{background:var(--sand-ink);border-color:var(--sand-ink)}
.tab svg{color:var(--green-3)}
.tab.sandy svg{color:var(--sand-ink)}
.cev{border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:12px;background:#fff}
.cev.pending{background:var(--sand-2);border-color:var(--sand-line);border-style:dashed}
.cev .cst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;border-radius:20px;padding:3px 12px;background:var(--pale);color:var(--green-2);margin-bottom:9px}
.cev.pending .cst{background:#fff;color:var(--sand-ink);border:1px dashed var(--sand-line)}
.cev .cnm{font-size:19px;font-weight:700;line-height:1.6;margin-bottom:8px}
.cev .cmeta{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.cev .cmeta span{display:inline-flex;align-items:center;gap:7px}
.cev .cmeta svg{color:var(--green-3)}
.cev.pending .cmeta svg{color:var(--sand-ink)}
.cev .cnote{font-size:14.5px;color:var(--muted);line-height:1.85;margin-bottom:10px}
.cprof{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;line-height:1.8}
.cprof dt{color:var(--green-2);font-weight:600;white-space:nowrap}
.cprof dd{margin:0;color:var(--muted)}
@media(max-width:640px){.cprof{grid-template-columns:1fr;gap:2px 0}.cprof dd{margin-bottom:8px}}
.srcline2{border-top:1px solid var(--line);padding-top:11px;margin-top:4px}
.srcline2 .rn{font-size:13.5px;color:var(--muted);display:flex;align-items:flex-start;gap:7px;line-height:1.7}
.srcline2 .rn svg{color:var(--green-3);margin-top:5px}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:20px;padding:3px 12px;font-size:13px;color:var(--green-2);background:#fff}
.copybtn:hover{background:var(--pale-2);border-color:var(--green-3)}
.copybtn svg{color:var(--green-3)}
.emptybox{border:1px dashed var(--line-2);border-radius:16px;padding:26px 24px;background:var(--pale-3);font-size:15.5px;color:var(--muted);line-height:1.9}

/* الشاشات الثانوية */
.plainrow{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:16px 18px;margin-bottom:10px;display:flex;gap:13px;transition:box-shadow .16s,border-color .16s}
.plainrow:hover{box-shadow:var(--shadow-2);border-color:var(--green-4)}
.plainrow .ic{color:var(--green-3);margin-top:6px}
.plainrow .t{font-size:17px;font-weight:600;line-height:1.6}
.plainrow .d{font-size:14.5px;color:var(--muted);margin-top:3px}
.plainrow .s{font-size:13.5px;color:var(--green-2);margin-top:6px}

footer.f{margin:70px 0 40px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer.f svg{color:var(--green-3);margin-top:5px;flex:0 0 auto}
.disclaimer{display:flex;gap:11px;align-items:flex-start;margin-top:26px;padding:17px 19px;
  background:var(--pale-3);border:1px solid var(--line);border-radius:14px;font-size:13.5px;line-height:2;color:var(--muted)}
.disclaimer b{color:var(--ink);font-weight:700}
.disclaimer svg{color:var(--sand-ink)}
@media(max-width:640px){.disclaimer{font-size:12.5px;padding:13px 14px}}

@media(max-width:860px){
  .twochoices,.three,.picks,.secondary{grid-template-columns:1fr}
  .home h1{font-size:30px}h1.screen{font-size:26px}
  .home{padding:52px 0 62px}.wrap{padding:0 20px}
  .meta{gap:12px}
}
/* ═══ الشريط الجانبي كدرج مخفي ═══ */
.app{grid-template-columns:1fr!important}
.side{position:fixed!important;top:0;bottom:0;inset-inline-start:0;inset-inline-end:auto;width:min(300px,86vw);height:100vh;z-index:80;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.7,.3,1);box-shadow:-14px 0 44px rgba(8,64,45,.28);display:flex!important;padding:0}
html[dir="rtl"] .side{transform:translateX(100%)}
body.navopen .side{transform:none}
.sidebd{position:fixed;inset:0;z-index:70;background:rgba(9,46,32,.34);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s ease}
body.navopen .sidebd{opacity:1;pointer-events:auto}
.sideclose{position:absolute;top:14px;inset-inline-start:14px;z-index:3;width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:#eaf7ef;background:rgba(255,255,255,.12)}
.sideclose:hover{background:rgba(255,255,255,.22)}

@media print{
  .mockbar,header.top,.tools,.facets,.foot,.secondary,footer.f,.row .chev{display:none!important}
  .copyrow{display:none}
  .src,.rrow{border-color:#ccc;background:#fff}
  body{font-size:12pt}
}

/* ═══ حركة عامة هادئة ═══ */
@keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
main>section{animation:fadeup .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══ شريط إحصاء مضغوط ═══ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin:0 0 20px}
@media(max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:12px;background:#fff;
  border:1px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--shadow);transition:.16s}
.stat:hover{box-shadow:var(--shadow-2);border-color:var(--green-4)}
.stat .si{width:42px;height:42px;border-radius:50%;background:var(--pale-2);color:var(--green-2);display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--green-4)}
.stat .sv{display:block;font-size:24px;font-weight:700;color:var(--green);line-height:1.3}
.stat .sl{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;order:-1}
.stat.gold{background:var(--sand-2);border-color:var(--sand-line)}
.stat.gold .si{border-color:var(--sand-line)}
.stat.gold .si{background:var(--sand);color:var(--sand-ink)}
.stat.gold .sv{color:var(--sand-ink)}

/* ═══ بطاقات المرشّحات القابلة للطي ═══ */
.fcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:8px;align-items:start;position:relative;z-index:20}
.fcard{background:#fff;border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);position:relative;transition:border-color .18s,box-shadow .18s,transform .18s}
.fcard:hover{border-color:var(--green-3);box-shadow:var(--shadow-2)}
.fcard.open{border-color:var(--green-2);box-shadow:var(--shadow-2)}
.fcard.picked{background:linear-gradient(180deg,var(--pale-2),#fff)}
.fhead{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:14px 15px}
.fhead .fi{width:40px;height:40px;border-radius:50%;background:var(--pale);color:var(--green-2);display:grid;place-items:center;flex:0 0 auto;transition:.18s}
.fcard.picked .fhead .fi,.fcard.open .fhead .fi{background:var(--green);color:#fff}
.fhead .fb{flex:1;min-width:0}
.fhead .ft{display:block;font-size:14px;color:var(--green);font-weight:700;line-height:1.5}
.fhead .fv{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard.picked .fhead .fv{color:var(--green-2);font-weight:600}
.fhead .fx{color:var(--green-3);transition:transform .22s ease;flex:0 0 auto}
.fcard.open .fhead .fx{transform:rotate(180deg)}
.fwrap{position:absolute;inset-block-start:calc(100% + 8px);inset-inline-start:0;width:min(420px,86vw);
  background:#fff;border:1px solid var(--green-2);border-radius:16px;box-shadow:var(--shadow-2);z-index:40;
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s ease,transform .22s ease}
.fcard.open .fwrap{opacity:1;transform:none;pointer-events:auto}
.fcard:nth-child(n+3) .fwrap{inset-inline-start:auto;inset-inline-end:0}
.fbody{overflow:hidden;border-radius:16px}
.fin{padding:13px}
.fsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:11px;padding:6px 11px;margin-bottom:9px;background:var(--pale-3)}
.fsearch svg{color:var(--green-3)}
.fsearch input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;padding:1px 0}
.fsearch input:focus{outline:0}
.frows{max-height:264px;overflow:auto;margin:0;padding:0;list-style:none}
.frow{display:flex;align-items:center;gap:9px;width:100%;text-align:start;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--ink);line-height:1.55;transition:background .14s}
.frow:hover{background:var(--pale-2)}
.frow .fk{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:0 0 auto;color:#fff}
.frow[aria-pressed="true"]{background:var(--pale);color:var(--green);font-weight:600}
.frow[aria-pressed="true"] .fk{background:var(--green-2);border-color:var(--green-2)}
.frow .fn{flex:1;min-width:0;overflow-wrap:anywhere;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:start}
.frow .fc2{font-size:12px;color:var(--muted);background:var(--pale-2);border-radius:20px;padding:0 9px;flex:0 0 auto}
.frow[aria-pressed="true"] .fc2{background:#fff;color:var(--green-2)}
.fmore{display:block;width:100%;text-align:center;font-size:13px;color:var(--green-2);padding:8px 0 2px;border-top:1px solid var(--line);margin-top:6px}
.fmore:hover{color:var(--green);background:var(--pale-3)}
.fempty{font-size:13.5px;color:var(--muted);padding:10px 4px}
.activebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0 18px;font-size:13.5px;color:var(--muted)}
.abchip{display:inline-flex;align-items:center;gap:7px;background:var(--green);color:#fff;border-radius:20px;padding:4px 13px;font-size:13.5px;max-width:100%;overflow-wrap:anywhere;text-align:start;line-height:1.6}
.abchip:hover{background:var(--green-2)}
.abchip svg{color:#fff;opacity:.8}
.abclear{color:var(--green-2);text-decoration:underline;font-size:13.5px}

/* ═══ بطاقات المسابقات والفعاليات ═══ */
.ccards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:4px}
.ccard{background:#fff;border:1px solid var(--line-2);border-radius:18px;padding:18px 19px;text-align:start;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--green-2)}
.ctop{display:flex;align-items:center;gap:10px}
.ctop .ci{width:42px;height:42px;border-radius:50%;background:var(--pale);color:var(--green-2);display:grid;place-items:center;flex:0 0 auto;transition:.18s}
.ccard:hover .ctop .ci{background:var(--green);color:#fff}
.ccard.gold .ctop .ci{background:var(--sand);color:var(--sand-ink)}
.ccard.gold:hover .ctop .ci{background:var(--sand-ink);color:#fff}
.cpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:20px;padding:2px 11px;background:var(--pale);color:var(--green-2);white-space:nowrap}
.ccard.gold .cpill{background:var(--sand);color:var(--sand-ink)}
.cname{font-size:17.5px;font-weight:700;line-height:1.55;color:var(--green);overflow-wrap:anywhere}
.corg{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.corg svg{color:var(--green-3);margin-top:4px;flex:0 0 auto}
.ctype{font-size:13px;color:var(--green-2);background:var(--pale-2);border-radius:10px;padding:5px 11px;align-self:flex-start;line-height:1.5}
.cdoms{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.cdom{font-size:12.5px;color:var(--green-2);border:1px solid var(--green-4);border-radius:20px;padding:1px 10px;background:var(--pale-3)}
.cdom.more{color:var(--muted);border-color:var(--line);background:#fff}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:11px;margin-top:2px}
.cfoot .cgo{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--green-2)}
.ccard:hover .cfoot .cgo{color:var(--green)}

/* ═══ لوحة التفاصيل الجانبية ═══ */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(9,30,23,.36);opacity:0;transition:opacity .24s ease}
.sheet.in .bd{opacity:1}
.sheet .pn{position:absolute;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:#fff;box-shadow:var(--shadow-2);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.22,.7,.3,1);display:flex;flex-direction:column}
html[dir="rtl"] .sheet .pn{transform:translateX(-100%)}
.sheet.in .pn{transform:none!important}
.shead{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--pale-2),#fff)}
.shead .si{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.shead.gold .si{background:var(--sand-ink)}
.shead h2{margin:6px 0 0;font-size:20px;line-height:1.55;color:var(--green);font-weight:700;overflow-wrap:anywhere}
.sclose{margin-inline-start:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);color:var(--green-2);display:grid;place-items:center;flex:0 0 auto}
.sclose:hover{background:var(--pale);border-color:var(--green-3)}
.sbody{overflow:auto;padding:18px 22px 26px;flex:1}
.sblk{margin-bottom:20px}
.sblk .sl2{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--green-2);margin-bottom:7px;font-weight:600}
.sblk .sl2 svg{color:var(--green-3)}
.sblk p{margin:0;font-size:15px;line-height:1.9;color:var(--ink);overflow-wrap:anywhere}
.sblk.quiet p{color:var(--muted)}
.sdoms{display:flex;gap:7px;flex-wrap:wrap}
.sdom{font-size:13px;color:var(--green-2);background:var(--pale-2);border:1px solid var(--green-4);border-radius:20px;padding:2px 12px}
.sdom:hover{background:var(--green);border-color:var(--green);color:#fff}
.sdivider{height:1px;background:var(--line);margin:18px 0}
.navsheet{display:flex;flex-direction:column;gap:4px}
.nvi2{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:13px 14px;border-radius:14px;
  font-size:15px;color:var(--ink);border:1px solid var(--line)}
.nvi2 svg{color:var(--green-3)}
.nvi2:hover{background:var(--pale-2);border-color:var(--green-4)}
.nvi2[aria-current="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.nvi2[aria-current="true"] svg{color:#fff}
.nc2{margin-inline-start:auto;font-size:12px;background:var(--pale-2);color:var(--green-2);border-radius:20px;padding:1px 9px}
.nvi2[aria-current="true"] .nc2{background:rgba(255,255,255,.2);color:#fff}
@media(max-width:860px){
  .fcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccards{grid-template-columns:minmax(0,1fr)}
  .sheet .pn{width:100%;inset-block-start:auto;height:92vh;border-radius:20px 20px 0 0;transform:translateY(100%)!important}
  .sheet.in .pn{transform:none!important}
}
@media(max-width:640px){
  .topin{flex-wrap:wrap;gap:9px;padding:10px 0}
  .hometitle{flex:1 1 auto;min-width:0}
  .hometitle .tx span{display:none}
  .hometitle .tx{font-size:14.5px;line-height:1.5}
  .topright{width:100%;justify-content:flex-start;gap:8px}
  .home{padding:38px 0 54px}
}
@media(max-width:560px){.fcards{grid-template-columns:minmax(0,1fr)}.stat{flex:1 1 100%}
  .fwrap,.fcard:nth-child(n+3) .fwrap{inset-inline:0;width:auto}}

/* ═══ الرئيسة: أربع بطاقات رئيسة ═══ */
.homecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:30px}
.big{box-shadow:var(--shadow);background:#fff;border-color:var(--line-2)}
.big:hover{box-shadow:var(--shadow-2)}
.big.solid{background:linear-gradient(155deg,var(--green-2),var(--green));border-color:var(--green);color:#fff}
.big.solid .bt,.big.solid .go{color:#fff}
.big.solid .bd{color:rgba(255,255,255,.82)}
.big.solid .ic{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);color:#fff}
.big.solid:hover{background:linear-gradient(155deg,var(--green),#092a1f)}
.big.dim{opacity:.88}
.loadbar{display:flex;align-items:center;gap:13px;background:var(--sand-2);border:1px solid var(--sand-line);border-radius:16px;padding:14px 17px;margin-bottom:26px}
.loadbar .li{width:40px;height:40px;border-radius:50%;background:var(--sand);color:var(--sand-ink);display:grid;place-items:center;flex:0 0 auto}
.loadbar .lt{flex:1;min-width:0;font-size:14px;color:var(--sand-ink);line-height:1.65}
.loadbar .lt b{display:block;font-size:15px;color:var(--ink)}
.loadbar .lb{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border-radius:22px;padding:8px 16px;font-size:14px;white-space:nowrap}
.loadbar .lb:hover{background:var(--green-2)}
@media(max-width:860px){.homecards{grid-template-columns:minmax(0,1fr)}.loadbar{flex-wrap:wrap}}


/* ══════════ هيكل التطبيق وفق المرجع البصري ══════════ */
body{background:var(--app-bg)}
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.col{min-width:0;display:flex;flex-direction:column}

/* الشريط الجانبي الداكن */
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0E5B40 0%,var(--green) 42%,var(--green-d) 100%);
  color:#fff;display:flex;flex-direction:column;padding:18px 14px 0;overflow:hidden;box-shadow:-8px 0 30px rgba(8,64,45,.14)}
.side .snm{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff}

.prow{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--tx-strong)}
.prow .pd{width:9px;height:9px;flex:none;border-radius:50%}
.prow .pv{margin-inline-start:auto;font-size:11.5px;color:var(--tx-3);white-space:nowrap}

/* ─── صفوف القوائم ─── */
.row{border:1px solid var(--bd);border-radius:var(--r-strip);background:var(--surface);box-shadow:var(--sh-chip);
  margin-bottom:10px;transition:box-shadow .16s,border-color .16s}
.row:hover{box-shadow:var(--sh-card);border-color:var(--g-200);transform:none}
.row button{padding:18px 20px;gap:16px;border-radius:var(--r-strip)}
.row .ic{width:46px;height:46px;border-radius:50%;background:var(--g-100);color:var(--g-700);margin-top:0}
.row .rc{font-size:11.5px;color:var(--tx-3)}
.row .rt{font-size:15.5px;font-weight:700;color:var(--tx-title);line-height:1.5;margin:2px 0 5px}
.row .rm{font-size:12.5px;color:var(--tx-3)}
.row .rm b{color:var(--g-700);font-weight:600}
.row .chev{color:var(--tx-chevron)}
.plainrow{border:1px solid var(--bd);border-radius:var(--r-strip);background:var(--surface);box-shadow:var(--sh-chip);padding:16px 20px}
.plainrow .t{font-size:14.5px;font-weight:700;color:var(--tx-title)}
.plainrow .d{font-size:12.5px;color:var(--tx-2);line-height:1.8}
.plainrow .s{font-size:12px;color:var(--g-700)}
.plainrow .ic{color:var(--g-500)}
.src{border:1px solid var(--bd);border-radius:var(--r-strip);box-shadow:var(--sh-chip);padding:16px 20px}
.src .sc{font-size:11.5px;color:var(--tx-3)}
.src .sn{font-size:14.5px;font-weight:600;color:var(--tx-title)}
.emptybox{border:1px solid var(--bd);background:var(--g-030);border-radius:var(--r-panel);color:var(--tx-3);font-size:13px}

/* ─── بطاقات المسابقات والمرشّحات ─── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin:0 0 18px}
.stat{border:1px solid var(--bd);border-radius:var(--r-inner);box-shadow:var(--sh-chip);padding:13px 15px}
.stat .si{width:36px;height:36px;border:0;background:var(--g-100);color:var(--g-700)}
.stat .sv{font-size:var(--fs-stat);color:var(--g-800);unicode-bidi:isolate}
.stat .sl{font-size:11.5px;color:var(--tx-3)}
.stat.gold{background:var(--surface);border-color:var(--bd)}
.stat.gold .si{background:var(--gold-100);color:var(--gold-600)}
.stat.gold .sv{color:var(--gold-tx-3)}
.fcard{border:1px solid var(--bd);border-radius:var(--r-inner);box-shadow:var(--sh-chip);background:var(--surface)}
.fcard:hover{border-color:var(--g-200);box-shadow:var(--sh-card)}
.fcard.open{border-color:var(--g-500)}
.fcard.picked{background:var(--surface)}
.fhead{padding:13px 15px}
.fhead .fi{width:36px;height:36px;background:var(--g-100);color:var(--g-700)}
.fcard.picked .fhead .fi,.fcard.open .fhead .fi{background:var(--g-700);color:#fff}
.fhead .ft{font-size:13px;color:var(--g-900)}
.fhead .fv{font-size:11.5px;color:var(--tx-3)}
.fcard.picked .fhead .fv{color:var(--g-700)}
.fwrap{border-color:var(--g-200);border-radius:var(--r-strip);box-shadow:var(--sh-float)}
.frow{font-size:13px}
.frow[aria-pressed="true"]{background:var(--g-100);color:var(--g-800)}
.frow .fk{border-color:var(--bd-control)}
.frow[aria-pressed="true"] .fk{background:var(--g-700);border-color:var(--g-700)}
.abchip{background:var(--g-700);border-radius:var(--r-pill);font-size:12.5px}
.abchip:hover{background:var(--g-800)}
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.ccard{border:1px solid var(--bd);border-radius:var(--r-strip);box-shadow:var(--sh-chip);padding:20px;gap:11px}
.ccard:hover{box-shadow:var(--sh-card);border-color:var(--g-200);transform:translateY(-2px)}
.ctop .ci{width:46px;height:46px;background:var(--g-100);color:var(--g-700)}
.ccard:hover .ctop .ci{background:var(--g-700);color:#fff}
.ccard.gold .ctop .ci{background:var(--gold-100);color:var(--gold-600)}
.ccard.gold:hover .ctop .ci{background:var(--gold-600);color:#fff}
.cpill{font-size:10.5px;font-weight:600;background:var(--g-100);color:var(--g-700);border-radius:var(--r-pill);padding:3px 11px}
.ccard.gold .cpill{background:var(--gold-100);color:var(--gold-tx-1)}
.cname{font-size:var(--fs-card);color:var(--tx-title)}
.corg{font-size:12.5px;color:var(--tx-2)}
.corg svg{color:var(--g-500)}
.ctype{font-size:12px;color:var(--g-700);background:var(--g-030);border:1px solid var(--bd-inner);border-radius:var(--r-control);padding:5px 11px}
.cdom{font-size:11.5px;color:var(--g-700);background:var(--g-100);border-color:transparent;border-radius:var(--r-pill)}
.cdom.more{background:var(--g-075);color:var(--tx-3)}
.cfoot{border-top:1px solid var(--bd-inner)}
.cfoot .cgo{font-size:12.5px;color:var(--g-700);font-weight:600}

/* ─── لوحة التفاصيل الفاخرة ─── */
.sheet .pn{width:min(560px,100%);background:var(--g-030)}
.shead{position:relative;padding:26px 28px 22px;border-bottom:1px solid var(--bd-strong);
  background:linear-gradient(150deg,#12603c 0%,#0f4b2f 62%,#0d3f28 100%);color:#fff;overflow:hidden}
.shead::after{content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(190,245,205,.16),transparent 68%);pointer-events:none}
.shead .si{width:52px;height:52px;border-radius:50%;background:rgba(226,255,236,.16);border:1px solid rgba(226,255,236,.22);color:#fff}
.shead h2{color:#fff;font-size:20px;margin:8px 0 0}
.shead .cpill{background:rgba(226,255,236,.18);color:#eaf7ef}
.shead.gold .cpill{background:rgba(230,193,104,.22);color:#f0dca8}
.shead .smeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.shead .smeta span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(224,241,231,.86);
  background:rgba(226,255,236,.10);border:1px solid rgba(226,255,236,.16);border-radius:var(--r-pill);padding:4px 11px}
.sclose{border-color:rgba(226,255,236,.26);color:#eaf7ef;background:rgba(226,255,236,.10)}
.sclose:hover{background:rgba(226,255,236,.20);border-color:rgba(226,255,236,.4)}
.sbody{padding:20px 22px 28px;background:var(--g-030)}
.sblk{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-inner);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh-chip)}
.sblk .sl2{font-size:11.5px;color:var(--tx-3);font-weight:600;margin-bottom:8px}
.sblk .sl2 .sic{width:28px;height:28px;border-radius:50%;background:var(--g-100);color:var(--g-700);display:grid;place-items:center;flex:none}
.sblk p{font-size:13.5px;line-height:1.9;color:var(--tx-strong)}
.sblk.quiet{background:var(--gold-050);border-color:var(--gold-bd-1)}
.sblk.quiet p{color:var(--gold-tx-2)}
.sdom{font-size:12.5px;background:var(--g-100);border-color:transparent;color:var(--g-700);border-radius:var(--r-pill)}
.sdom:hover{background:var(--g-700);color:#fff}
.sdivider{display:none}
.sactions{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.sact{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#fff;background:var(--grad-btn);
  border-radius:var(--r-btn);padding:10px 16px;box-shadow:var(--sh-btn)}
.sact.ghost{color:var(--g-700);background:var(--surface);border:1px solid var(--g-200);box-shadow:none}
.copybtn{font-size:12px;color:var(--g-700);border-color:var(--bd-control);border-radius:var(--r-control);padding:6px 12px}

/* ─── شريطا التذييل ─── */
.refstrip{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:22px;padding:16px 20px;
  border-radius:var(--r-strip);background:var(--g-040);border:1px solid var(--bd-strip);font-size:12.5px;color:var(--tx-body)}
.refstrip .l{display:flex;align-items:center;gap:10px}
.refstrip svg{color:var(--tx-meta);flex:none}
.refstrip .b{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--g-700);
  background:var(--surface);border:1px solid var(--g-200);border-radius:var(--r-control);padding:9px 14px;white-space:nowrap}
.refstrip .b:hover{background:var(--g-050)}
.aialert{position:relative;margin-top:16px;border:1px solid var(--gold-bd-3);border-radius:var(--r-strip);
  background:var(--grad-alert);padding:20px 24px;box-shadow:var(--sh-alert);overflow:hidden}
.aialert::before{content:"";position:absolute;top:0;bottom:0;inset-inline-end:0;width:4px;background:var(--grad-gold-rail)}
.aialert .ain{display:flex;align-items:flex-start;gap:14px}
.aialert .aic{width:38px;height:38px;flex:none;border-radius:50%;background:var(--gold-075);border:1px solid var(--gold-bd-2);
  display:grid;place-items:center;color:var(--gold-600)}
.aialert .at{font-size:13.5px;font-weight:700;color:var(--gold-tx-1)}
.aialert p{margin:6px 0 0;font-size:12.5px;line-height:2;color:var(--gold-tx-2);text-wrap:pretty}
.aialert p b{font-weight:600}
.disclaimer{display:none}
.notebar{display:none}
.secondary{display:none}
.homecards{display:none}
.loadbar{display:flex;align-items:center;gap:13px;background:var(--gold-050);border:1px solid var(--gold-bd-1);
  border-radius:var(--r-strip);padding:14px 18px;margin-bottom:18px}
.loadbar .li{background:var(--gold-075);color:var(--gold-600);border-radius:50%}
.loadbar .lt{font-size:12.5px;color:var(--gold-tx-2)}
.loadbar .lt b{font-size:13.5px;color:var(--gold-tx-1)}
.loadbar .lb{background:var(--grad-btn);border-radius:var(--r-btn);box-shadow:var(--sh-btn);font-size:12.5px}

/* ─── التركيز ─── */
:focus-visible{outline:2px solid var(--g-700);outline-offset:2px;border-radius:6px}

/* ─── الاستجابة: الشريط الجانبي يتحول إلى شريط أيقونات على اليمين ─── */
@media(max-width:980px){
  .app{grid-template-columns:68px 1fr}
  .side{display:flex;padding:0}
  .side .snm b,.sidestat,.side .snm small{display:none}
  .side .snm{justify-content:center;padding:14px 0 2px}
  .nav{padding:10px 8px}
  .nvi{justify-content:center;padding:12px 0;gap:0}
  .nvi span.nl,.nvi .nc{display:none}
  .sideart{height:96px}
  .mnav{display:none!important}
  main#main{padding-bottom:0}
  .tbin{padding:18px 18px 0;gap:12px}
  .hero .htx{padding:30px 24px 26px;min-width:0;flex:1 1 100%}
  .hero .hart{min-height:210px;max-width:100%;flex:1 1 100%}
  .fstep .cv2{display:none}
  .sideart{height:96px;overflow:hidden}
  .sideart .glow{width:120px;height:90px;bottom:-30px}
  .panels{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:27px}
  .page{padding:20px 18px 34px}
  .refstrip{flex-direction:column;align-items:flex-start}
}
@media(max-width:640px){
  .brand .lg{width:46px;height:46px}
  .brand .bt2{font-size:18px}
  .brand .bs{font-size:12px}
  .kpi .n{font-size:22px}
}

/* ─── الطباعة: السجل المفتوح فقط ─── */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .app,.side,.topbar,.waveband,main#main,.mnav,.toast,.mtool{display:none!important}
  body.printing .sheet{position:static!important;display:block!important;inset:auto!important;background:#fff!important}
  body.printing .sheet .bd{display:none!important}
  body.printing .sheet .pn{position:static!important;width:100%!important;max-width:100%!important;height:auto!important;
    transform:none!important;box-shadow:none!important;background:#fff!important;display:block!important}
  body.printing .shead{background:#fff!important;color:var(--g-900)!important;border-bottom:2px solid var(--g-200)!important;padding:0 0 12px!important}
  body.printing .shead h2{color:var(--g-900)!important;font-size:19px}
  body.printing .shead .si{background:var(--g-100)!important;color:var(--g-700)!important;border-color:var(--g-200)!important}
  body.printing .shead .cpill{background:var(--g-100)!important;color:var(--g-700)!important}
  body.printing .shead .smeta span{background:#fff!important;color:var(--tx-strong)!important;border-color:var(--bd)!important}
  body.printing .sclose,body.printing .sactions{display:none!important}
  body.printing .sbody{background:#fff!important;padding:14px 0 0!important;overflow:visible!important}
  body.printing .sblk{break-inside:avoid;box-shadow:none!important;border-color:var(--bd)!important}
  body.printing .copyrow{display:none!important}
}

/* ═══════════ إضافات الطبقة البصرية: بحث شامل، تعليم، لوحة سريعة، حيوية ═══════════ */

/* لمعان تموجي على شعار البنك الكبير في الرئيسية */
.hero h1{background:linear-gradient(100deg,var(--g-900) 32%,#2f8d5e 43%,#d8b45c 50%,#2f8d5e 57%,var(--g-900) 68%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:omSheen 6.5s linear infinite}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none;-webkit-text-fill-color:currentColor;background:none}}


/* الرئيسة: الخريطة أعلى المنتصف والعنوان أسفلها */
.hero .hin{flex-direction:column;align-items:center;text-align:center;padding:34px 28px 30px;gap:6px}
.hero .hart{order:1;flex:none;max-width:100%;width:100%;min-height:0;background:none}
.hero .htx{order:2;flex:none;min-width:0;width:100%;max-width:760px;padding:0}
.hero h1{font-size:clamp(21px,2vw,29px);letter-spacing:-.4px}
.hero p{margin:12px auto 0;max-width:620px;font-size:14px;line-height:1.8}
.hero .hbtns{justify-content:center}
.hmap{width:100%}
/* ═══ خريطة الأقسام في الرئيسة: وميض + تفاعل ═══ */
.hmap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.hmapcap{font-size:12.5px;color:var(--tx-body);min-height:18px;text-align:center;transition:color .18s}
.heroart{overflow:visible}
@keyframes hRing{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes hSpark{0%,100%{opacity:.62}50%{opacity:1}}
@keyframes hGlow{0%,100%{opacity:.6;filter:none}50%{opacity:1;filter:drop-shadow(0 0 6px rgba(21,115,74,.45))}}
@keyframes hCore{0%,100%{opacity:.55;stroke-width:1.2}50%{opacity:1;stroke-width:2.2}}
@keyframes hHalo{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.05)}}
@keyframes hLines{0%,100%{opacity:.4}50%{opacity:.95}}
.heroart .hr{animation:hRing 4.2s ease-in-out infinite}
.heroart .hr2{animation-duration:5.4s;animation-delay:.5s}
.heroart .hr3{animation-duration:6.6s;animation-delay:1s}
.heroart .hlines{animation:hLines 4.6s ease-in-out infinite}
.heroart .hweb{animation:hLines 7s ease-in-out infinite reverse}
.heroart .hhalo{transform-origin:210px 175px;animation:hHalo 4.6s ease-in-out infinite}
.heroart .hcore{animation:hCore 2.6s ease-in-out infinite}
.heroart .hcenter{cursor:pointer;transition:transform .22s cubic-bezier(.22,.7,.3,1)}
.heroart .hcenter:hover,.heroart .hcenter:focus-visible{transform:scale(1.07);outline:none}
.heroart .hnode{cursor:pointer;animation:hGlow 3.2s ease-in-out infinite;transition:transform .22s cubic-bezier(.22,.7,.3,1)}
.heroart .hnode .hnh{animation:hSpark 3.6s ease-in-out infinite}
.heroart .hnode:hover,.heroart .hnode:focus-visible{transform:scale(1.32);animation-play-state:paused;outline:none}
.heroart .hnn{opacity:0;transition:opacity .2s ease}
.heroart .hnd{transition:opacity .2s ease}
.heroart .hnl{transition:fill .2s ease,opacity .2s ease;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px}
.heroart .hnode:hover .hnn,.heroart .hnode:focus-visible .hnn{opacity:1}
.heroart .hnode:not(.nocount):hover .hnd,.heroart .hnode:not(.nocount):focus-visible .hnd{opacity:0}
.heroart .hnode:hover .hnl,.heroart .hnode:focus-visible .hnl{fill:var(--green);font-weight:700}
.heroart .hnode:hover .hnb,.heroart .hnode:focus-visible .hnb{stroke:var(--green);stroke-width:1.6}
.heroart .hnode:hover .hnd,.heroart .hnode:focus-visible .hnd{fill:#c9a442}
.heroart .hn1{animation-delay:.1s}
.heroart .hn2{animation-delay:.5s}
.heroart .hn3{animation-delay:.9s}
.heroart .hn4{animation-delay:1.3s}
.heroart .hn5{animation-delay:1.7s}
.heroart .hn6{animation-delay:2.1s}
.heroart .hn7{animation-delay:2.5s}
@media (prefers-reduced-motion:reduce){.heroart *{animation:none!important}}

/* حيوية: ظهور متتابع + تفاعل ألطف */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.list .row,.ccards .ccard,.kpis .kpi,.stats .stat,.fcards .fcard,.plainrow,.rrow{animation:riseIn .42s cubic-bezier(.22,.7,.3,1) both}
.list .row:nth-child(1),.ccards .ccard:nth-child(1),.kpis .kpi:nth-child(1),.stats .stat:nth-child(1),.fcards .fcard:nth-child(1){animation-delay:.02s}
.list .row:nth-child(2),.ccards .ccard:nth-child(2),.kpis .kpi:nth-child(2),.stats .stat:nth-child(2),.fcards .fcard:nth-child(2){animation-delay:.06s}
.list .row:nth-child(3),.ccards .ccard:nth-child(3),.kpis .kpi:nth-child(3),.stats .stat:nth-child(3),.fcards .fcard:nth-child(3){animation-delay:.1s}
.list .row:nth-child(4),.ccards .ccard:nth-child(4),.kpis .kpi:nth-child(4),.stats .stat:nth-child(4),.fcards .fcard:nth-child(4){animation-delay:.14s}
.list .row:nth-child(n+5),.ccards .ccard:nth-child(n+5),.kpis .kpi:nth-child(n+5),.stats .stat:nth-child(n+5){animation-delay:.18s}
.kpi{transition:background .2s ease,transform .2s ease}
.kpi:hover{background:var(--g-050);transform:translateY(-2px)}
.stat{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-card);border-color:var(--g-200)}
.nvi{transition:background .18s ease,padding-inline-start .18s ease}
.nvi:hover{padding-inline-start:16px}
.hbtn{transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.hbtn:hover{transform:translateY(-1px);filter:saturate(1.06)}
.ccard,.fcard{transition:transform .18s cubic-bezier(.22,.7,.3,1),box-shadow .18s ease,border-color .18s ease}
.ccard:hover{transform:translateY(-3px)}

/* أدوات الصف: تعليم البطاقة + معاينة سريعة */
.row .rin{display:flex;align-items:stretch;gap:0}
.row .rmain{flex:1;min-width:0}
.row .racts{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 12px 0 0;
  border-inline-start:1px solid var(--bd-inner);margin:14px 0}
.row .ract{display:grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%;
  border:1px solid var(--bd-control);background:var(--surface);color:var(--tx-3);
  transition:color .16s ease,border-color .16s ease,background .16s ease,transform .16s ease}
.row .ract:hover{color:var(--g-700);border-color:var(--g-200);background:var(--g-050);transform:scale(1.06)}
.row .ract[aria-pressed="true"]{color:var(--gold-600);border-color:var(--gold-bd-1);background:var(--gold-100)}
.row.marked{border-color:var(--gold-bd-1);box-shadow:0 0 0 1px var(--gold-bd-2) inset,var(--sh-chip)}
.favbtn{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--gold-tx-3);
  background:var(--gold-100);border:1px solid var(--gold-bd-1);border-radius:var(--r-control);padding:10px 14px}
.favbtn[aria-pressed="true"]{background:var(--gold-075);color:var(--gold-tx-1)}
.tbtn.on{background:var(--g-100);border-color:var(--g-200);color:var(--g-700)}

/* رقائق المرشّحات النشطة في شاشة القائمة */
.lbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 16px;font-size:12.5px;color:var(--tx-2)}

/* اللوحة السريعة — بحث شامل واختصارات */
.palbtn{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:500;color:#3c6350;
  background:var(--surface);border:1px solid var(--bd-control);border-radius:var(--r-control);padding:9px 13px}
.palbtn:hover{border-color:var(--g-200);background:var(--g-040)}
.palbtn kbd{font-family:inherit;font-size:11px;color:var(--tx-3);background:var(--g-040);
  border:1px solid var(--bd-control);border-radius:6px;padding:1px 6px;direction:ltr}
.pal{position:fixed;inset:0;z-index:95;display:none}
.pal.on{display:block}
.pal .pbd{position:absolute;inset:0;background:rgba(9,30,23,.34);opacity:0;transition:opacity .2s ease}
.pal.in .pbd{opacity:1}
.pbox{position:absolute;inset-block-start:12vh;inset-inline:0;margin:0 auto;width:min(680px,92vw);
  background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-panel);box-shadow:0 24px 60px rgba(9,40,26,.22);
  overflow:hidden;transform:translateY(-10px) scale(.99);opacity:0;transition:transform .22s cubic-bezier(.22,.7,.3,1),opacity .22s ease}
.pal.in .pbox{transform:none;opacity:1}
.phead{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--bd-inner);background:var(--g-040)}
.phead svg{color:var(--g-500)}
.phead input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--tx-title)}
.phead input::placeholder{color:var(--tx-placeholder)}
.phead kbd{font-family:inherit;font-size:11px;color:var(--tx-3);background:var(--surface);
  border:1px solid var(--bd-control);border-radius:6px;padding:2px 7px;direction:ltr}
.pres{max-height:min(56vh,460px);overflow:auto;padding:8px}
.pgrp{font-size:11px;color:var(--tx-meta);padding:10px 12px 6px}
.pitem{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:11px 12px;border-radius:12px;
  transition:background .12s ease}
.pitem .pic{width:32px;height:32px;flex:none;border-radius:50%;background:var(--g-100);color:var(--g-700);display:grid;place-items:center}
.pitem .pb{flex:1;min-width:0}
.pitem .pl{display:block;font-size:13.5px;font-weight:600;color:var(--tx-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .ps{display:block;font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pitem .pg{flex:none;color:var(--tx-chevron)}
.pitem.sel,.pitem:hover{background:var(--g-050)}
.pitem.sel .pg{color:var(--g-700)}
.pitem.gold .pic{background:var(--gold-100);color:var(--gold-600)}
.pempty{padding:26px 14px;text-align:center;font-size:13px;color:var(--tx-3)}
.pfoot{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:11px 18px;border-top:1px solid var(--bd-inner);
  background:var(--g-040);font-size:11.5px;color:var(--tx-3)}
.pfoot b{font-weight:600;color:var(--tx-2)}
.pfoot kbd{font-family:inherit;font-size:10.5px;color:var(--tx-2);background:var(--surface);
  border:1px solid var(--bd-control);border-radius:5px;padding:1px 6px;direction:ltr}
.kbdlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px}
.kbdrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
  border:1px solid var(--bd);border-radius:var(--r-inner);background:var(--surface);font-size:13px;color:var(--tx-sub)}
.kbdrow kbd{font-family:inherit;font-size:11.5px;color:var(--g-700);background:var(--g-050);
  border:1px solid var(--g-200);border-radius:6px;padding:2px 8px;direction:ltr;white-space:nowrap}
@media(max-width:640px){.palbtn span.pt{display:none}.pbox{inset-block-start:6vh}}

/* ── كأس المسابقات: ذهبي غامق مع وميض واضح ── */
@keyframes goldPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(185,143,33,.42),0 4px 12px rgba(120,88,10,.18)}
  50%{box-shadow:0 0 0 9px rgba(185,143,33,0),0 6px 18px rgba(120,88,10,.26)}
}
@keyframes goldGlint{0%{transform:translateX(-120%) rotate(12deg)}55%,100%{transform:translateX(220%) rotate(12deg)}}
.ctop .ci{position:relative;overflow:hidden;background:linear-gradient(150deg,#b8912a 0%,#9a7415 58%,#7d5c0c 100%)!important;
  color:#fff6dd!important;border:1px solid #d8b45c;animation:goldPulse 2.6s ease-in-out infinite}
.ctop .ci::after{content:"";position:absolute;inset-block:-40%;width:38%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,248,222,.85),rgba(255,255,255,0));
  animation:goldGlint 3.2s ease-in-out infinite;pointer-events:none}
.ccard:hover .ctop .ci{background:linear-gradient(150deg,#caa036 0%,#a87f18 58%,#8a660d 100%)!important}
.shead .si{background:linear-gradient(150deg,#b8912a,#8a660d)!important;color:#fff6dd!important;border:1px solid #d8b45c}
@media (prefers-reduced-motion:reduce){.ctop .ci{animation:none}.ctop .ci::after{display:none}}

/* تمييز «قيد التحقق» لم يبقَ ذهبيًا — تمييز محايد */
.ccard.gold{border-color:var(--bd-strong)}
.ccard.gold .cpill{background:var(--g-075);color:var(--tx-2)}
.stat.gold .si{background:var(--g-075);color:var(--tx-2)}

/* ── إحصاءات المسابقات: مطوية تحت عنوان يُفتح بالضغط ── */
.statfold{border:1px solid var(--bd);border-radius:var(--r-panel);background:var(--surface);
  box-shadow:var(--sh-chip);margin:0 0 18px;overflow:hidden}
.statfold>summary{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;list-style:none;
  font-size:16px;font-weight:700;color:var(--tx-sub);transition:background .16s ease}
.statfold>summary::-webkit-details-marker{display:none}
.statfold>summary::marker{content:""}
.statfold>summary:hover{background:var(--g-040)}
.statfold>summary>svg{color:var(--g-700);flex:none}
.statfold>summary .sfn{flex:1;min-width:0;font-weight:400;font-size:13px;color:var(--tx-3)}
.statfold>summary .sfx{color:var(--tx-chevron);transition:transform .2s ease;display:inline-flex}
.statfold[open]>summary{border-bottom:1px solid var(--bd-inner);background:var(--g-040)}
.statfold[open]>summary .sfx{transform:rotate(180deg)}
.statfold .stats{margin:0;padding:16px 18px 18px}

/* ── خريطة الأقسام: وميض ظاهر على النصوص ── */
@keyframes nodeLabelGlow{
  0%,100%{fill:#2f5546;filter:drop-shadow(0 0 0 rgba(201,164,66,0))}
  50%{fill:#12603c;filter:drop-shadow(0 0 6px rgba(201,164,66,.85))}
}
@keyframes centerLabelGlow{
  0%,100%{filter:drop-shadow(0 0 1px rgba(255,246,221,.35))}
  50%{filter:drop-shadow(0 0 9px rgba(255,232,168,.95))}
}
.heroart .hnl{animation:nodeLabelGlow 3.4s ease-in-out infinite;stroke-width:4px}
.heroart .hn1 .hnl{animation-delay:.0s}
.heroart .hn2 .hnl{animation-delay:.35s}
.heroart .hn3 .hnl{animation-delay:.7s}
.heroart .hn4 .hnl{animation-delay:1.05s}
.heroart .hn5 .hnl{animation-delay:1.4s}
.heroart .hn6 .hnl{animation-delay:1.75s}
.heroart .hn7 .hnl{animation-delay:2.1s}
.heroart .hcl{animation:centerLabelGlow 3s ease-in-out infinite}
.heroart .hnn{font-size:15px}
.hmapcap{font-size:14px!important;font-weight:600;min-height:22px!important}
@media (prefers-reduced-motion:reduce){.heroart .hnl,.heroart .hcl{animation:none}}

/* دائرة الكأس: مساحة أوضح وأكبر */
.ctop .ci{width:62px!important;height:62px!important;border-width:1.5px}
.ctop .ci svg{width:30px;height:30px}
.shead .si{width:58px!important;height:58px!important}
.shead .si svg{width:30px;height:30px}
@media(max-width:640px){.ctop .ci{width:54px!important;height:54px!important}.ctop .ci svg{width:26px;height:26px}}

/* وميض ظاهر على نصوص بطاقات المسابقات وعناوينها */
@keyframes textSheen{0%{background-position:210% 0}100%{background-position:-110% 0}}
.ccard .cname{font-size:17.5px;line-height:1.55;
  background:linear-gradient(100deg,var(--tx-title) 30%,#2f8d5e 42%,#d8b45c 50%,#2f8d5e 58%,var(--tx-title) 70%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:textSheen 4.6s linear infinite}
.statfold>summary>span:first-of-type{
  background:linear-gradient(100deg,var(--g-900) 30%,#2f8d5e 42%,#d8b45c 50%,#2f8d5e 58%,var(--g-900) 70%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:textSheen 5.2s linear infinite}
.ccard .corg{font-size:13.5px}
.ccard .ctype{font-size:12.5px}
@media (prefers-reduced-motion:reduce){
  .ccard .cname,.statfold>summary>span:first-of-type{animation:none;-webkit-text-fill-color:currentColor;background:none}
}

@media(max-width:980px){.side{display:flex!important;padding:0;width:min(300px,86vw)}
  .side .snm{justify-content:flex-start;padding:18px 16px 4px}
  .side .snm b,.side .snm small,.sidestat{display:block}
  .nav{padding:16px 14px 6px}
  .nvi{justify-content:flex-start;padding:11px 13px;gap:11px}
  .nvi span.nl,.nvi .nc{display:inline-flex}
  .sideart{height:150px}
  .mnav{display:none!important}main#main{padding-bottom:0}}
/* ═══ أقسام الرئيسة القابلة للطي ═══ */
.acc{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.accit{border:1px solid var(--bd-strong);border-radius:var(--r-card,18px);background:var(--surface);overflow:hidden;box-shadow:var(--sh-card,none)}
.acch{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:16px 20px;
  font-size:var(--fs-panel);font-weight:700;color:#134a33;background:none;transition:background .18s}
.acch span{flex:1;min-width:0}
.acch svg{color:var(--g-500);flex:none}
.acch:hover{background:var(--g-040)}
.acch .accv{display:flex;transition:transform .24s ease;color:var(--tx-3)}
.accit.on .acch{background:var(--g-040)}
.accit.on .acch .accv{transform:rotate(180deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.accit.on .accb{grid-template-rows:1fr}
.accb>*{overflow:hidden;min-height:0}
.accit:not(.on) .accb>*{padding-block:0!important;border-top-color:transparent}
.acc .panel.flat{border:0;border-radius:0;box-shadow:none;background:none;padding:4px 20px 20px}
.acc .kpis{border-top:1px solid var(--bd-strong)}
@media (prefers-reduced-motion:reduce){.accb{transition:none}}
.side{overflow:hidden auto!important;scrollbar-width:thin}
@media(max-height:700px){.sideart{display:none}}
@media(max-width:980px){.brand{flex:0 1 auto;min-height:0}.tbin{align-items:stretch}}

/* ═══ نسخة مستقلة: منع التمرير الأفقي الناتج عن درج التنقّل المغلق خارج الشاشة ═══ */
html,body{overflow-x:hidden}
</style>
</head>
<body>

<div class="app">

  <aside class="side">
    <button class="sideclose" id="sideclose" aria-label="إخفاء القائمة"></button>
    <div class="snm"><span class="lg" id="mk2"></span><b>بنك المسابقات<small>والتحديات الابتكارية</small></b></div>
    <nav class="nav" id="nav" aria-label="التنقّل الرئيس"></nav>
    <div class="sidestat" id="sidestat"></div>
    <div class="sideart" aria-hidden="true"><span class="glow"></span>
      <svg viewBox="0 0 150 150" fill="none">
        <circle cx="75" cy="70" r="46" stroke="rgba(214,250,224,.24)" stroke-width="1"></circle>
        <circle cx="75" cy="70" r="32" stroke="rgba(214,250,224,.40)" stroke-width="1"></circle>
        <circle cx="75" cy="70" r="18" fill="rgba(226,255,236,.14)" stroke="rgba(226,255,236,.55)" stroke-width="1"></circle>
        <circle cx="75" cy="70" r="5" fill="#e6c168"></circle>
        <circle cx="75" cy="24" r="3" fill="rgba(230,193,104,.9)"></circle>
        <circle cx="118" cy="88" r="2.5" fill="rgba(226,255,236,.7)"></circle>
        <circle cx="34" cy="92" r="2.5" fill="rgba(226,255,236,.55)"></circle>
        <path d="M75 70 L75 24 M75 70 L118 88 M75 70 L34 92" stroke="rgba(226,255,236,.26)" stroke-width="1"></path>
      </svg></div>
  </aside>

  <div class="sidebd" id="sidebd"></div>

  <div class="col">
    <header class="topbar">
      <div class="waveband" aria-hidden="true">
        <div class="veil"></div>
        <svg viewBox="0 0 1200 230" preserveAspectRatio="none" fill="none">
          <path d="M0 0 H1200 V96 C1010 150 880 44 660 92 C470 133 300 66 0 122 Z" fill="rgba(21,115,74,.07)"></path>
          <path d="M0 0 H1200 V54 C1040 108 900 12 640 58 C430 96 250 34 0 82 Z" fill="rgba(21,115,74,.06)"></path>
          <path d="M0 0 H1200 V26 C1080 74 940 2 700 34 C480 64 240 8 0 46 Z" fill="rgba(21,115,74,.05)"></path>
        </svg>
        <span class="dots"><i style="background:rgba(21,115,74,.16)"></i><i style="background:rgba(21,115,74,.13)"></i><i style="background:rgba(21,115,74,.10)"></i><i style="background:rgba(21,115,74,.07)"></i></span>
      </div>
      <div class="tbin">
        <button class="brand" data-go="home" title="العودة إلى الرئيسية">
          <span class="lg" id="mk"></span>
          <span><span class="bt2">بنك المسابقات والتحديات الابتكارية</span>
            <span class="bs">مرجع داعم للتحديات والاحتياجات والفرص والاتجاهات الابتكارية.</span></span>
        </button>
        <span class="tbact">
          <button class="backlink home" id="gohome" data-go="home"></button>
          <button class="backlink" id="back"></button>
          <span class="mtool" id="mtool">
            <button class="mtoolbtn" id="mtoolbtn" aria-haspopup="true" aria-expanded="false"></button>
            <span class="mpanel" id="mpanel">
              <span class="srcbox" id="srcinfo" hidden></span>
              <button class="upbtn" id="update"></button>
              <button class="upbtn alt" id="reread" hidden></button>
            </span>
          </span>
          <span class="verchip" id="verchip"></span>
          <button class="palbtn" data-pal="1" title="بحّاثة شاملة عبر كل أقسام البنك"></button>
          <input type="file" id="pick" accept=".docx" hidden>
        </span>
      </div>
    </header>
    <main id="main"></main>
  </div>



</div>
